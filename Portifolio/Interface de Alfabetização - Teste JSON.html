<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white shadow-2xl rounded-3xl p-8 border border-slate-100">
        <!-- Cabeçalho de Status (Dados do JSON) -->
        <div class="flex justify-between items-center mb-8">
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold" id="aluno-id">ALUNO: APAC-05</span>
            <span class="text-slate-400 text-xs font-mono" id="status-sync">Sincronizado_Cache</span>
        </div>

        <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Monte a Palavra:</h1>
        <p class="text-slate-500 text-center mb-8 italic" id="instrucao">Fase: Silábica</p>

        <!-- Área de Construção -->
        <div id="drop-zone" class="drop-zone flex gap-3 items-center justify-center mb-10 bg-slate-50">
            <!-- As sílabas clicadas aparecerão aqui -->
        </div>

        <!-- Área de Opções (Fonemas do JSON) -->
        <div id="syllables-container" class="flex flex-wrap gap-4 justify-center">
            <!-- As sílabas do JSON serão geradas aqui -->
        <div class="syllable-card bg-blue-600 text-white px-6 py-4 rounded-xl font-black text-xl shadow-lg">DA</div><div class="syllable-card bg-blue-600 text-white px-6 py-4 rounded-xl font-black text-xl shadow-lg">LI</div><div class="syllable-card bg-blue-600 text-white px-6 py-4 rounded-xl font-black text-xl shadow-lg">DE</div><div class="syllable-card bg-blue-600 text-white px-6 py-4 rounded-xl font-black text-xl shadow-lg">BER</div></div>

        <button onclick="window.location.reload()" class="w-full mt-10 py-4 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-colors">
            PRÓXIMA AULA (IA)
        </button>
    </div>

    <script>
        // ESTE É O SEU JSON VINDO DO SERVIDOR ANDROID
        const jsonDoServidor = {
            "id_aluno": "APAC-05",
            "fase": "Silábica",
            "conteudo": {
                "palavra": "LIBERDADE",
                "fonemas": ["DA", "LI", "DE", "BER"], // Bagunçado para o teste
                "exercicio_ia": "construcao_frase"
            },
            "status": "Sincronizado_Cache"
        };

        // Função para Processar o JSON e renderizar a tela
        function renderizarAula(dados) {
            document.getElementById('aluno-id').innerText = `ALUNO: ${dados.id_aluno}`;
            document.getElementById('status-sync').innerText = dados.status;
            document.getElementById('instrucao').innerText = `Fase: ${dados.fase}`;

            const container = document.getElementById('syllables-container');
            const dropZone = document.getElementById('drop-zone');

            // Criar botões para cada fonema do JSON
            dados.conteudo.fonemas.forEach(fonema => {
                const btn = document.createElement('div');
                btn.className = "syllable-card bg-blue-600 text-white px-6 py-4 rounded-xl font-black text-xl shadow-lg";
                btn.innerText = fonema;
                
                btn.onclick = () => {
                    const clone = btn.cloneNode(true);
                    clone.className = "bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold animate-bounce";
                    dropZone.appendChild(clone);
                    btn.style.visibility = "hidden"; // Esconde o original
                };

                container.appendChild(btn);
            });
        }

        // Simula o recebimento do JSON
        window.onload = () => renderizarAula(jsonDoServidor);
    </script>
