<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Rede P2P em Tempo Real</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #2a2a2a; border: 2px solid #444; border-radius: 8px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .controls { margin-top: 15px; padding: 10px; background: #333; border-radius: 5px; }
        .status { color: #00ff88; font-size: 12px; }
    </style>
</head>
<body>

    <h2>Monitoramento de Rede P2P (Trilateração)</h2>
    <div class="status" id="status">Recebendo pacotes JSON via WebSocket simulado...</div>
    
    <canvas id="mapaCanvas" width="800" height="500"></canvas>

    <div class="controls">
        <small>Âncoras Fixas: Vermelho | Nós Móveis: Azul (Interpolação Ativa)</small>
    </div>

<script>
const canvas = document.getElementById('mapaCanvas');
const ctx = canvas.getContext('2d');

// Configuração de Escala (1 metro = 40 pixels)
const ESCALA = 40;

// Dados das Âncoras (Nós Fixos no estabelecimento)
const ancoras = [
    { id: 'anchor_1', x: 2, y: 2, label: 'Entrada' },
    { id: 'anchor_2', x: 18, y: 2, label: 'Balcão' },
    { id: 'anchor_3', x: 10, y: 10, label: 'Estoque' }
];

// Estado do Nó Móvel (Onde ele está x Onde ele deveria estar)
let dispositivoMovel = {
    id: 'mobile_device_01',
    xAtual: 5, yAtual: 5,    // Posição no canvas (suave)
    xDestino: 5, yDestino: 5, // Posição vinda da trilateração
    cor: '#00d4ff'
};

// SIMULAÇÃO: Função que chegaria via sua rede WebSocket/JSON
function receberDadosTrilateracao() {
    // Simulando flutuação de sinal de trilateração (coordenadas em metros)
    dispositivoMovel.xDestino = Math.random() * 16 + 2; 
    dispositivoMovel.yDestino = Math.random() * 8 + 2;
    
    document.getElementById('status').innerText = 
        `JSON Recebido: { id: "${dispositivoMovel.id}", x: ${dispositivoMovel.xDestino.toFixed(2)}m, y: ${dispositivoMovel.yDestino.toFixed(2)}m }`;
}

// Loop de renderização (Animação)
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Desenhar Âncoras
    ancoras.forEach(a => {
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(a.x * ESCALA, a.y * ESCALA, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.fillText(a.label, a.x * ESCALA - 20, a.y * ESCALA - 15);
    });

    // 2. Lógica de Interpolação (Suavização do movimento)
    // O valor 0.05 define a fluidez (menor = mais lento/suave)
    dispositivoMovel.xAtual += (dispositivoMovel.xDestino - dispositivoMovel.xAtual) * 0.05;
    dispositivoMovel.yAtual += (dispositivoMovel.yDestino - dispositivoMovel.yAtual) * 0.05;

    // 3. Desenhar Dispositivo Móvel
    ctx.shadowBlur = 15;
    ctx.shadowColor = dispositivoMovel.cor;
    ctx.fillStyle = dispositivoMovel.cor;
    ctx.beginPath();
    ctx.arc(dispositivoMovel.xAtual * ESCALA, dispositivoMovel.yAtual * ESCALA, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0; // reset shadow

    ctx.fillStyle = 'white';
    ctx.fillText("Dispositivo Ativo", dispositivoMovel.xAtual * ESCALA - 40, dispositivoMovel.yAtual * ESCALA + 25);

    requestAnimationFrame(draw);
}

// Iniciar simulação de rede a cada 2 segundos
setInterval(receberDadosTrilateracao, 2000);

// Iniciar loop de desenho
draw();
</script>
</body>
</html>
