<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Diagrama de Divisão Óptica Purista</title>
    <style>
        :root { --glass: rgba(0, 212, 255, 0.3); --beam: #ffd700; }
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .setup-container { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #333; width: 95%; max-width: 1200px; }
        
        /* Ilustração do Caminho da Luz */
        .optical-path { position: relative; height: 250px; background: #000; border-radius: 10px; margin-bottom: 40px; overflow: hidden; border: 1px solid #222; }
        .light-source { position: absolute; left: 0; top: 50%; width: 100%; height: 4px; background: linear-gradient(90deg, var(--beam) 0%, transparent 100%); transform: translateY(-50%); box-shadow: 0 0 20px var(--beam); opacity: 0.8; }
        
        /* Espelhos (Beam Splitters) */
        .splitter-row { position: absolute; display: flex; width: 100%; justify-content: space-around; top: 0; height: 100%; }
        .splitter { width: 2px; height: 60px; background: var(--glass); transform: rotate(45deg); align-self: center; box-shadow: 0 0 10px var(--wire); }
        .reflected-beam { position: absolute; width: 2px; background: linear-gradient(0deg, transparent, var(--beam)); bottom: 50%; }

        /* Matriz de Visualização */
        .camera-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
        .camera-unit { position: relative; aspect-ratio: 1; background: #000; border: 1px solid #444; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .sensor-view { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
        .lux-tag { position: absolute; bottom: 0; background: rgba(0,0,0,0.8); width: 100%; text-align: center; font-size: 9px; color: var(--beam); }
        
        .controls { margin-top: 20px; background: #222; padding: 20px; border-radius: 10px; display: flex; gap: 40px; align-items: center; }
        .info-panel { border-left: 3px solid var(--beam); padding-left: 20px; max-width: 400px; font-size: 0.9em; color: #aaa; }
        input[type=range] { width: 200px; accent-color: var(--beam); }
    </style>
</head>
<body>

<div class="setup-container">
    <h2 style="color: var(--beam);">Simulador de Divisão em Cascata (50/50)</h2>
    
    <!-- Representação Esquemática do Hardware -->
    <div class="optical-path" id="path">
        <div class="light-source" id="main-beam"></div>
        <div class="splitter-row" id="splitters">
            <!-- Gerado via JS para mostrar os espelhos -->
        </div>
    </div>

    <!-- Visão dos Sensores -->
    <div class="camera-grid" id="grid">
        <!-- 16 Câmeras -->
    </div>

    <div class="controls">
        <div>
            <label>Intensidade da Fonte (Sol/Laser)</label><br>
            <input type="range" id="power" min="1000" max="100000" value="50000">
            <div id="power-val">50.000 Lux</div>
        </div>

        <div class="info-panel">
            <strong>Física do Sistema:</strong><br>
            Note que cada espelho (Beam Splitter) é um cubo de vidro. 
            A <strong>Câmera 1</strong> recebe 50%. A <strong>Câmera 16</strong> recebe apenas 1/65.536 da luz inicial. 
            Sem erro de paralaxe, mas com perda logarítmica crítica.
        </div>
    </div>
</div>

<script>
    const powerInput = document.getElementById('power');
    const grid = document.getElementById('grid');
    const splitters = document.getElementById('splitters');
    const mainBeam = document.getElementById('main-beam');

    // Inicializar 16 câmeras e espelhos
    for(let i=0; i<16; i++) {
        // Criar Sensores
        const unit = document.createElement('div');
        unit.className = 'camera-unit';
        unit.innerHTML = `
            <img src="https://images.unsplash.com" class="sensor-view" id="cam-${i}">
            <div class="lux-tag" id="tag-${i}">0 Lux</div>
        `;
        grid.appendChild(unit);

        // Criar Espelhos no Diagrama
        if(i < 15) {
            const s = document.createElement('div');
            s.className = 'splitter';
            splitters.appendChild(s);
        }
    }

    function update() {
        const p = parseInt(powerInput.value);
        document.getElementById('power-val').innerText = p.toLocaleString() + " Lux";
        
        let currentLux = p;
        
        for(let i=0; i<16; i++) {
            currentLux = currentLux * 0.5; // Perda de 50% em cada estágio
            
            const cam = document.getElementById(`cam-${i}`);
            const tag = document.getElementById(`tag-${i}`);
            
            // Simulação de visibilidade do sensor
            // Consideramos que abaixo de 50 Lux a imagem é puro ruído/preto
            const visibility = Math.min(currentLux / 1000, 1);
            cam.style.opacity = visibility;
            tag.innerText = currentLux < 1 ? "< 1 Lux" : Math.round(currentLux).toLocaleString() + " Lux";
            
            // Se a luz for muito baixa, aplicar filtro de ruído visual
            cam.style.filter = `grayscale(1) brightness(${visibility * 2})`;
        }

        // Ajustar brilho do feixe no diagrama
        mainBeam.style.opacity = p / 100000;
    }

    powerInput.oninput = update;
    update();
</script>

</body>
</html>
