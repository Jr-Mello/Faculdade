<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Biblioteca APAC - Empréstimos + Multas + Reservas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--prim:#8e44ad;--succ:#27ae60;--warn:#e67e22;--danger:#c0392b;--info:#3498db}
  body{font-family:Segoe UI,Arial,sans-serif;background:#f0f2f5;margin:0;padding:10px;color:#2c3e50}
  header{background:var(--prim);color:#fff;padding:25px;text-align:center;border-radius:12px 12px 0 0}
  .container{max-width:1400px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,0.15);overflow:hidden}
  .tabs{display:flex;flex-wrap:wrap;background:#2c3e50}
  .tablink{padding:18px 20px;flex:1;text-align:center;color:#fff;border:none;cursor:pointer;font-weight:bold;transition:.3s}
  .tablink:hover{background:#34495e}
  .tablink.active{background:var(--prim)}
  .tabcontent{padding:35px;display:none}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
  input,select,textarea{padding:13px;border:1px solid #ccc;border-radius:8px;width:100%;font-size:1rem;box-sizing:border-box}
  button{padding:15px 30px;border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;margin:8px 4px}
  button:hover{opacity:0.92}
  .success{background:var(--succ)}
  .danger{background:var(--danger)}
  .warning{background:var(--warn)}
  .info{background:var(--info)}
  .pdf{background:var(--prim)}
  .small{padding:9px 18px;font-size:0.9rem}
  .badge{padding:7px 15px;border-radius:25px;color:#fff;font-weight:bold;font-size:0.85rem}
  .reserva{background:#9b59b6}
  .emprestado{background:#e74c3c}
  .disponivel{background:var(--succ)}
  .atrasado{color:var(--danger);font-weight:bold}
  table{width:100%;border-collapse:collapse;margin:25px 0}
  th{background:var(--prim);color:#fff;padding:15px;text-align:left}
  td{padding:12px;border:1px solid #ddd}
  tr:nth-child(even){background:#f8f9fa}
  .search-box{padding:15px;width:100%;max-width:600px;border-radius:10px;border:1px solid #ccc;font-size:1.1rem}
</style>


  <style>
    /* Seu CSS original aqui (mantido) */
    body {font-family: Arial, sans-serif; margin:0; background:#f5f5f5; color:#333;}
    header {background:#1565c0; color:white; padding:20px; text-align:center;}
    .container {max-width:1200px; margin:auto; padding:20px;}
    .tabs {overflow:hidden; border-bottom:1px solid #ccc; background:#fff;}
    .tablink {background:none; border:none; padding:14px 20px; cursor:pointer; float:left; font-size:16px;}
    .tablink:hover, .tablink.active {background:#1565c0; color:white;}
    .tabcontent {display:none; padding:20px; background:white; border-radius:0 0 10px 10px; min-height:500px;}
    .form-grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:15px; margin:20px 0;}
    input, select, textarea {width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;}
    button {padding:12px 24px; border:none; border-radius:5px; cursor:pointer; margin:5px;}
    .success {background:#4caf50; color:white;}
    .danger {background:#e74c3c; color:white;}
    .info {background:#3498db; color:white;}
    .reserva {background:#9b59b6; color:white;}
    .pdf {background:#e67e22; color:white;}
    .small {padding:6px 12px; font-size:0.9rem;}
    .badge {padding:4px 10px; border-radius:12px; font-size:0.8rem; margin-left:8px;}
    .disponivel {background:#4caf50; color:white;}
    .emprestado {background:#e74c3c; color:white;}
    .search-box {width:100%; max-width:500px; padding:12px; margin:20px 0;}
    .atrasado {color:#c0392b; font-weight:bold;}
  </style>
</head>
<body>
<header>
  <h1>Biblioteca APAC - Sistema Completo</h1>
  <p>Empréstimos • Multas • Reservas • Remissão por Leitura</p>
</header>

<div class="container">
  <!-- BOTÕES DE BACKUP (adicionados aqui no topo) -->
  <div style="margin:20px 0; padding:20px; background:#e3f2fd; border-radius:10px; text-align:center;">
    <h3>Backup e Restauração de Dados</h3>
    <button class="success" onclick="exportarJSON()">Exportar para JSON</button>
    <button class="info" onclick="exportarXML()">Exportar para XML</button>
    <button class="danger" onclick="importarJSON()">Importar JSON</button>
    <button class="danger" onclick="importarXML()">Importar XML</button>
    <input type="file" id="fileInput" style="display:none" accept=".json,.xml">
    <p style="margin-top:10px; font-size:0.9rem; color:#555;">
      Todos os dados (recuperandos, livros, empréstimos, reservas, multas, leituras) serão salvos/restaurados.
    </p>
  </div>

  <div class="tabs">
    <button class="tablink active" onclick="openTab(event,'recuperando')">Recuperandos</button>
    <button class="tablink" onclick="openTab(event,'livros')">Acervo</button>
    <button class="tablink" onclick="openTab(event,'emprestimo')">Empréstimo</button>
    <button class="tablink" onclick="openTab(event,'reservas')">Reservas</button>
    <button class="tablink" onclick="openTab(event,'multas')">Multas</button>
    <button class="tablink" onclick="openTab(event,'leitura')">Remissão</button>
    <button class="tablink" onclick="openTab(event,'relatorio')">Relatórios</button>
  </div>

  <!-- Todo o resto do seu HTML original (mantido igual) -->
  <!-- ... (todas as abas: recuperando, livros, etc.) ... -->
  <!-- (Cole aqui todo o conteúdo das abas que você já tinha) -->

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// === SUAS VARIÁVEIS E FUNÇÕES ORIGINAIS (mantidas) ===
let db;
let recuperandos = [], livros = [], emprestimos = [], reservas = [], multas = [], leituras = [];
const VALOR_MULTA_DIA = () => parseFloat(localStorage.getItem("multa_valor") || "1.00");
const MAX_RESERVAS_POR_PESSOA = 2;

// === IndexedDB (igual) ===
const request = indexedDB.open("BibliotecaAPAC_Reservas", 11); // versão aumentada para nova estrutura
request.onupgradeneeded = e => {
  db = e.target.result;
  ["recuperandos","livros","emprestimos","reservas","multas","leituras"].forEach(store => {
    if (!db.objectStoreNames.contains(store)) {
      if (store === "livros") db.createObjectStore(store, {keyPath: "id", autoIncrement: true});
      else if (store === "recuperandos") db.createObjectStore(store, {keyPath: "matricula"});
      else db.createObjectStore(store, {keyPath: "id", autoIncrement: true});
    }
  });
};
request.onsuccess = e => { db = e.target.result; iniciar(); };

// === FUNÇÕES DE BACKUP E RESTAURAÇÃO ===

function exportarJSON() {
  const dados = {
    recuperandos, livros, emprestimos, reservas, multas, leituras,
    valorMultaDia: VALOR_MULTA_DIA(),
    versao: "1.0",
    data: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup_biblioteca_apac_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert("Backup JSON exportado com sucesso!");
}

function exportarXML() {
  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<bibliotecaAPAC data="${new Date().toISOString()}">\n`;
  xml += `  <config><valorMultaDia>${VALOR_MULTA_DIA()}</valorMultaDia></config>\n`;

  const addArray = (name, array) => {
    xml += `  <${name}>\n`;
    array.forEach(item => {
      xml += `    <item>\n`;
      Object.keys(item).forEach(key => {
        const value = item[key] === null || item[key] === undefined ? "" : item[key];
        xml += `      <${key}>${escapeXml(String(value))}</${key}>\n`;
      });
      xml += `    </item>\n`;
    });
    xml += `  </${name}>\n`;
  };

  addArray("recuperandos", recuperandos);
  addArray("livros", livros);
  addArray("emprestimos", emprestimos);
  addArray("reservas", reservas);
  addArray("multas", multas);
  addArray("leituras", leituras);

  xml += `</bibliotecaAPAC>`;

  const blob = new Blob([xml], {type: "application/xml"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup_biblioteca_apac_${new Date().toISOString().slice(0,10)}.xml`;
  a.click();
  URL.revokeObjectURL(url);
  alert("Backup XML exportado com sucesso!");
}

function escapeXml(unsafe) {
  return unsafe.replace(/[<>&'"]/g, c => ({
    '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;'
  }[c]));
}

function importarJSON() {
  if (!confirm("ATENÇÃO: Isso substituirá TODOS os dados atuais.\nTem certeza?")) return;
  document.getElementById("fileInput").accept = ".json";
  document.getElementById("fileInput").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const dados = JSON.parse(ev.target.result);
        if (dados.valorMultaDia) localStorage.setItem("multa_valor", dados.valorMultaDia);
        importarDados(dados);
      } catch (err) {
        alert("Erro ao ler JSON: " + err.message);
      }
    };
    reader.readAsText(file);
  };
  document.getElementById("fileInput").click();
}

function importarXML() {
  if (!confirm("ATENÇÃO: Isso substituirá TODOS os dados atuais.\nTem certeza?")) return;
  document.getElementById("fileInput").accept = ".xml";
  document.getElementById("fileInput").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parser = new DOMParser();
        const xml = parser.parseFromString(ev.target.result, "text/xml");
        const dados = { valorMultaDia: VALOR_MULTA_DIA() };

        const getArray = name => {
          const items = xml.querySelectorAll(`${name} > item`);
          return Array.from(items).map(item => {
            const obj = {};
            item.querySelectorAll("*").forEach(el => {
              obj[el.tagName] = el.textContent;
            });
            return obj;
          });
        };

        dados.recuperandos = getArray("recuperandos");
        dados.livros = getArray("livros");
        dados.emprestimos = getArray("emprestimos");
        dados.reservas = getArray("reservas");
        dados.multas = getArray("multas");
        dados.leituras = getArray("leituras");

        const multaConfig = xml.querySelector("valorMultaDia");
        if (multaConfig) localStorage.setItem("multa_valor", multaConfig.textContent);

        importarDados(dados);
      } catch (err) {
        alert("Erro ao ler XML: " + err.message);
      }
    };
    reader.readAsText(file);
  };
  document.getElementById("fileInput").click();
}

function importarDados(dados) {
  // Limpa tudo primeiro
  const tx = db.transaction(["recuperandos","livros","emprestimos","reservas","multas","leituras"], "readwrite");
  tx.objectStore("recuperandos").clear();
  tx.objectStore("livros").clear();
  tx.objectStore("emprestimos").clear();
  tx.objectStore("reservas").clear();
  tx.objectStore("multas").clear();
  tx.objectStore("leituras").clear();

  tx.oncomplete = () => {
    const tx2 = db.transaction(["recuperandos","livros","emprestimos","reservas","multas","leituras"], "readwrite");
    ["recuperandos","livros","emprestimos","reservas","multas","leituras"].forEach(store => {
      (dados[store] || []).forEach(item => {
        // Corrige tipos numéricos
        if (store === "livros") {
          item.exemplaresTotal = parseInt(item.exemplaresTotal) || 1;
          item.exemplaresDisponiveis = parseInt(item.exemplaresDisponiveis) || item.exemplaresTotal;
          item.id = parseInt(item.id);
        }
        if (item.id) item.id = parseInt(item.id);
        tx2.objectStore(store).add(item);
      });
    });
    tx2.oncomplete = () => {
      alert("Dados restaurados com sucesso! Recarregando...");
      location.reload();
    };
  };
}

// === Todas as suas funções originais (salvarRecuperando, realizarEmprestimo, etc.) continuam aqui ===
// (Cole aqui todo o resto do seu <script> original, sem alterações)

// Iniciar tudo
function iniciar() {
  document.getElementById("dataEmprestimo").valueAsDate = new Date();
  document.getElementById("dataConclusao").valueAsDate = new Date();
  document.getElementById("dataReserva").valueAsDate = new Date();
  document.getElementById("valorMultaDia").value = VALOR_MULTA_DIA();
  carregarTudo();
}

// ... (o resto do seu código original continua igual até o final)

</script>
</body>
</html>
