    table { width: 100%; border-collapse: collapse; margin-top: 15px; }

<style>
:root{--azul:#003087;--verde:#00b894;--cinza:#f8f9fa;--erro:#e74c3c;--sucesso:#00b894;--amarelo:#f39c12}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:15px;background-attachment:fixed}
.container{max-width:1200px;margin:20px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
header{background:var(--azul);color:#fff;text-align:center;padding:30px 20px}
header h1{font-size:1.9rem;margin-bottom:8px}
.tabs{display:flex;background:#f1f1f1;flex-wrap:wrap}
.tab{flex:1;min-width:120px;padding:16px;text-align:center;cursor:pointer;font-weight:600;transition:.3s}
.tab:hover{background:#ddd}.tab.active{background:var(--azul);color:#fff}
.tab-content{display:none;padding:35px;animation:fade .5s}.tab-content.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;margin:25px 0}
label{display:block;margin-bottom:6px;font-weight:600;color:#2d3436}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid #ddd;border-radius:10px;font-size:1rem;transition:.3s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(0,48,135,.15)}
.btn{background:var(--verde);color:#fff;padding:12px 28px;border:none;border-radius:10px;font-size:1rem;cursor:pointer;margin:10px 5px 0 0;transition:.3s}
.btn:hover{background:#00a07f;transform:translateY(-2px)}
.btn-sm{font-size:.85rem;padding:6px 12px}
.btn-del{background:#e74c3c;color:#fff}
.btn-del:hover{background:#c0392b}
.btn-amarelo{background:var(--amarelo);color:#fff}
.btn-amarelo:hover{background:#e67e22}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:.95rem}
th{background:var(--azul);color:#fff;padding:12px;text-align:left}
td{padding:10px;border-bottom:1px solid #eee}
tr:hover{background:#f8f9fa}
input[type="search"]{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;max-width:350px;margin-bottom:15px}
.success{background:#d5f4e6;color:#0b8457;padding:12px;border-radius:8px;margin-top:15px;text-align:center;display:none}
.dias-remidos{font-weight:bold;color:var(--verde);font-size:1.1em}
footer{text-align:center;padding:20px;background:var(--cinza);color:#555;font-size:.9rem}
@media(max-width:768px){.tabs{flex-direction:column}.form-grid{grid-template-columns:1fr}table{font-size:.9rem}th,td{padding:8px}}
</style>

  db.livros = acervoBibliotecaAPACPOA;

// === FUNÇÕES GERAIS ===
function salvarDB() {
  localStorage.setItem('apac_livros', JSON.stringify(db.livros));
  localStorage.setItem('apac_recuperandos', JSON.stringify(db.recuperandos));
  localStorage.setItem('apac_remissoes', JSON.stringify(db.remissoes));
}

function openTab(evt, tabName) {
  document.querySelectorAll(".tabcontent").forEach(t => t.style.display = "none");
  document.querySelectorAll(".tablinks").forEach(t => t.classList.remove("active"));
  document.getElementById(tabName).style.display = "block";
  evt.currentTarget.classList.add("active");

  if (tabName === 'Livros') { listarLivros(); atualizarTotal(); }
  if (tabName === 'Remissao') atualizarSelectsRemissao();
  if (tabName === 'Relatorios') { atualizarSelectRelatorio(); document.getElementById('mesRelatorio').value = new Date().toISOString().slice(0,7); }
}

// === LIVROS ===
function atualizarTotal() {
  document.getElementById('totalLivros').textContent = db.livros.length;
}

function filtrarLivros() {
  const termo = document.getElementById('buscaLivro').value.toLowerCase();
  const filtrados = db.livros.filter(l => 
    l.titulo.toLowerCase().includes(termo) || 
    l.autor.toLowerCase().includes(termo) || 
    l.cod.includes(termo)
  );
  mostrarLivros(filtrados);
}

function mostrarLivros(lista) {
  const container = document.getElementById('listaLivros');
  if (lista.length === 0) { container.innerHTML = '<p>Nenhum livro encontrado.</p>'; return; }
  let html = '<table><tr><th>Cód.</th><th>Título</th><th>Autor</th><th>Gênero</th><th>Ação</th></tr>';
  lista.forEach((l,i) => {
    html += `<tr><td>${l.cod}</td><td>${l.titulo}</td><td>${l.autor}</td><td>${l.genero}</td>
             <td><button class="btn-danger" onclick="removerLivro(${i})">Remover</button></td></tr>`;
  });
  html += '</table>';
  container.innerHTML = html;
}

function listarLivros() { mostrarLivros(db.livros); }

// ==================== BACKUP & EXPORTAÇÃO ====================
function exportarJSON(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download = `backup-apac-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportarCSV(){
  let csv = "Tipo;Recuperando;Matrícula;Livro;Data Leitura;Revisor;Dias Remidos;Data Cadastro\n";
  db.leituras.forEach(l => {
    const rec = db.rec[l.recId];
    const livro = db.livro[l.livroId];
    const vol = db.vol[l.volId];
    csv += `Leitura;${rec.nome};${rec.mat};${livro.titulo};${l.data};${vol.nome};4;${l.dataCad}\n`;
  });
  db.rec.forEach(r => {
    csv += `Recuperando;${r.nome};${r.mat};;;;${livrosLidosPor(r)*4};${r.data}\n`;
  });

  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = `relatorio-apac-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}




document.getElementById('imp').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      db = JSON.parse(ev.target.result);
      salvar(); contar(); atualizarTudo();
      document.getElementById('msgBackup').textContent = 'Backup importado com sucesso!';
      document.getElementById('msgBackup').style.display = 'block';
    }catch(err){alert('Arquivo inválido ou corrompido')}
  };
  r.readAsText(file);
};

function excluir(tipo, idx){
  if(confirm('Excluir este registro?')){
    if(tipo==='leitura') db.leituras.splice(idx,1);
    else db[tipo].splice(idx,1);
    salvar(); contar(); atualizarTudo();
  }
}
