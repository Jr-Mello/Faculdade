<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sincronia de Visão - Barramento Analógico</title>
    <style>
        :root { --bg: #0a0a0c; --java: #f89820; --js: #f7df1e; --accent: #00f2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        
        /* O Objeto Real (A Projeção) */
        .source-projection { width: 300px; height: 200px; background: #222; border: 4px solid #444; border-radius: 10px; margin-top: 50px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0, 242, 255, 0.1); }
        .target-object { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; position: absolute; filter: blur(5px); }

        /* Feixes de Visão (Conexão Analógica) */
        .vision-beams { display: flex; justify-content: space-around; width: 100%; max-width: 900px; margin-top: 20px; }
        .beam { width: 2px; height: 100px; background: linear-gradient(to top, var(--java), transparent); opacity: 0.3; }

        /* Servidores (Nós Java) */
        .nodes-container { display: flex; justify-content: space-around; width: 100%; max-width: 900px; gap: 20px; }
        .node { flex: 1; background: #16161a; border: 2px solid #333; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; }
        .node.active { border-color: var(--java); }
        .viewfinder { width: 100%; height: 80px; background: #000; border-radius: 4px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.7em; overflow: hidden; position: relative; }
        
        /* Hub de Dados (Consenso JS) */
        .consensus-hub { margin-top: 40px; background: var(--js); color: #000; padding: 15px 40px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        .node-label { font-size: 0.75em; color: var(--java); font-weight: bold; display: block; margin-bottom: 5px; }
        .data-stream { font-family: monospace; font-size: 0.7em; color: #888; }
        
        .pulse { animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0% { background: #16161a; } 50% { background: #331111; border-color: red; } 100% { background: #16161a; } }
    </style>
</head>
<body>

    <h3 style="margin-top: 20px; color: var(--accent);">REALIDADE PROJETADA (Barramento Analógico)</h3>
    <div class="source-projection" id="screen">
        <div class="target-object" id="ball"></div>
        <div style="font-size: 0.6em; color: #444; z-index: -1;">FONTE ÚNICA DE LUZ</div>
    </div>

    <div class="vision-beams">
        <div class="beam"></div><div class="beam"></div><div class="beam"></div>
    </div>

    <div class="nodes-container">
        <!-- NÓ 01 -->
        <div class="node active" id="n1">
            <span class="node-label">NÓ 01: BIOMECÂNICA (JAVA)</span>
            <div class="viewfinder" id="v1">
                <div style="width: 10px; height: 10px; border: 1px solid lime;" id="v1-dot"></div>
            </div>
            <div class="data-stream" id="d1">JSON: [X, Y, Speed]</div>
        </div>

        <!-- NÓ 02 -->
        <div class="node active" id="n2">
            <span class="node-label">NÓ 02: TERMOGRAFIA (JAVA)</span>
            <div class="viewfinder" style="background: linear-gradient(45deg, #300, #100);" id="v2">
                <div style="width: 15px; height: 15px; background: rgba(255,0,0,0.5); border-radius: 50%;" id="v2-dot"></div>
            </div>
            <div class="data-stream" id="d2">JSON: [Heat_Map]</div>
        </div>

        <!-- NÓ 03 -->
        <div class="node active" id="n3">
            <span class="node-label">NÓ 03: CONTEXTO (JAVA)</span>
            <div class="viewfinder" id="v3">
                <div style="border: 1px solid cyan; padding: 2px;" id="v3-dot">ID: PESSOA</div>
            </div>
            <div class="data-stream" id="d3">JSON: [Tag_ID]</div>
        </div>
    </div>

    <div class="consensus-hub" id="hub">HUB DE CONSENSO: MONITORANDO</div>

    <script>
        const ball = document.getElementById('ball');
        const dots = [document.getElementById('v1-dot'), document.getElementById('v2-dot'), document.getElementById('v3-dot')];
        const hub = document.getElementById('hub');
        const nodes = [document.getElementById('n1'), document.getElementById('n2'), document.getElementById('n3')];

        let angle = 0;
        function animate() {
            angle += 0.05;
            const x = Math.cos(angle) * 100 + 130;
            const y = Math.sin(angle) * 60 + 80;

            // Move objeto na fonte original
            ball.style.left = x + 'px';
            ball.style.top = y + 'px';

            // Cada Nó Java "vê" e processa a mesma coordenada em seu contexto
            dots[0].style.transform = `translate(${(x-130)/2}px, ${(y-80)/2}px)`; // Simula análise vetorial
            dots[1].style.transform = `translate(${(x-130)/2}px, ${(y-80)/2}px)`; // Simula rastro térmico
            dots[2].style.transform = `translate(${(x-130)/2}px, ${(y-80)/2}px)`; // Simula ID de objeto

            // Simulação de Evento Brusco (Anomalia)
            if (Math.sin(angle) > 0.98) {
                nodes.forEach(n => n.classList.add('pulse'));
                hub.innerText = "ALERTA: QUEDA DETECTADA (CONSENSO P2P)";
                hub.style.background = "red";
                hub.style.color = "white";
            } else if (Math.sin(angle) < 0) {
                nodes.forEach(n => n.classList.remove('pulse'));
                hub.innerText = "HUB DE CONSENSO: MONITORANDO";
                hub.style.background = "var(--js)";
                hub.style.color = "#000";
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
