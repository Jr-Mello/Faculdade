<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>P2P Vision Mesh Simulator</title>
    <style>
        :root { --bg: #050505; --panel: #111; --java: #f89820; --js: #f7df1e; --accent: #00f2ff; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; }
        
        /* Simulação da Rede Bridge P2P */
        .network-monitor { width: 350px; background: var(--panel); border-right: 2px solid #222; padding: 15px; display: flex; flex-direction: column; }
        .log-container { flex: 1; background: #000; border: 1px solid #333; padding: 10px; font-size: 0.75em; overflow-y: auto; color: #0f0; margin-bottom: 10px; }
        
        /* Área do Dashboard de Consenso */
        .dashboard { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .node-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .node-card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 5px; text-align: center; }
        .node-card.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .node-card h4 { margin: 0 0 10px 0; font-size: 0.8em; color: var(--java); }

        /* Visualizador de Imagem (Barramento Analógico) */
        .vision-feed { flex: 1; background: #000; border-radius: 10px; position: relative; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: rgba(0, 242, 255, 0.2); animation: scan 3s linear infinite; }
        
        .alert-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.2); display: none; flex-direction: column; align-items: center; justify-content: center; border: 5px solid red; }

        @keyframes scan { from { top: 0; } to { top: 100%; } }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Lado Esquerdo: Simulador da Rede Bridge P2P -->
    <div class="network-monitor">
        <h3>P2P BRIDGE MONITOR</h3>
        <p style="font-size: 0.7em; color: #888;">Protocolo: WS / Classe Java Nativa</p>
        <div class="log-container" id="p2p-log">
            > Aguardando inicialização dos nós...
        </div>
        <button class="btn" onclick="startSim()">Ativar Nós P2P</button>
    </div>

    <!-- Lado Direito: Dashboard de Consenso JS -->
    <div class="dashboard">
        <div class="node-grid">
            <div class="node-card" id="node-1">
                <h4>NÓ 01: BIOMETRIA</h4>
                <div id="status-1" style="color: #555;">OFFLINE</div>
            </div>
            <div class="node-card" id="node-2">
                <h4>NÓ 02: GEOMETRIA</h4>
                <div id="status-2" style="color: #555;">OFFLINE</div>
            </div>
            <div class="node-card" id="node-3">
                <h4>NÓ 03: CONTEXTO</h4>
                <div id="status-3" style="color: #555;">OFFLINE</div>
            </div>
        </div>

        <div class="vision-feed" id="feed">
            <div class="scan-line"></div>
            <div id="feed-text" style="color: #444;">AGUARDANDO SINAL ANALÓGICO...</div>
            
            <div class="alert-overlay" id="alert">
                <h1 style="margin: 0; font-size: 3em;">ALERTA DE QUEDA</h1>
                <p id="consensus-data">CONSENSO: 98.4% de precisão (3/3 Nós)</p>
            </div>
        </div>

        <div style="background: #111; padding: 15px; border-radius: 5px; font-size: 0.9em;">
            <span style="color: var(--js);">JS RENDERING:</span> <span id="js-status">IDLE</span> | 
            <span style="color: var(--java);">JAVA ENGINE:</span> <span id="java-status">IDLE</span>
        </div>
    </div>

    <script>
        const log = document.getElementById('p2p-log');
        const jsStatus = document.getElementById('js-status');
        const javaStatus = document.getElementById('java-status');

        function addLog(msg, type) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const color = type === 'java' ? '#f89820' : '#f7df1e';
            log.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function startSim() {
            addLog("Iniciando Bridge P2P...", "java");
            javaStatus.innerText = "RUNNING (WS SERVER)";
            jsStatus.innerText = "LISTENING";
            document.getElementById('feed-text').innerText = "VISUALIZANDO BARRAMENTO ANALÓGICO...";

            // Simula conexão dos nós via WS
            setTimeout(() => activateNode(1, "Saúde OK"), 800);
            setTimeout(() => activateNode(2, "Estável"), 1500);
            setTimeout(() => activateNode(3, "Ambiente Limpo"), 2200);

            // Simula um evento de risco após 5 segundos
            setTimeout(triggerEmergency, 5000);
        }

        function activateNode(id, msg) {
            const node = document.getElementById(`node-${id}`);
            node.classList.add('active');
            document.getElementById(`status-${id}`).innerText = msg;
            document.getElementById(`status-${id}`).style.color = "#0f0";
            addLog(`Nó ${id} (Java) conectado via P2P`, "java");
        }

        function triggerEmergency() {
            addLog("ALERTA: Nó 2 detectou desvio vetorial brusco!", "java");
            addLog("Enviando JSON via WebSocket para Malha P2P...", "java");
            
            setTimeout(() => {
                addLog("JS Dashboard: Recebendo pacotes de 3 nós...", "js");
                document.getElementById('status-1').innerText = "RITMO CARDÍACO ALTO";
                document.getElementById('status-2').innerText = "QUEDA DETECTADA";
                document.getElementById('status-3').innerText = "POSIÇÃO: CHÃO";
                
                // Consenso atingido
                document.getElementById('alert').style.display = 'flex';
                jsStatus.innerText = "RENDERING ALERT (98FPS)";
                addLog("CONSENSO ATINGIDO: Disparando Alarme de Veredito.", "js");
            }, 500);
        }
    </script>
</body>
</html>
