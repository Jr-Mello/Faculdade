<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>P2P Mesh - Visualização de Troca de Dados</title>
    <style>
        :root { --bg: #08080a; --java: #f89820; --js: #f7df1e; --accent: #00f2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        
        .container { display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        
        /* Representação dos Servidores (Nós) */
        .network-map { display: flex; justify-content: space-around; align-items: center; flex: 1; position: relative; border: 1px dashed #333; border-radius: 20px; margin: 20px 0; }
        
        .node { width: 120px; height: 160px; background: #1a1a1e; border: 2px solid #444; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; transition: 0.3s; }
        .node.active { border-color: var(--java); box-shadow: 0 0 15px rgba(248, 152, 32, 0.3); }
        .node-label { font-size: 0.7em; margin-top: 10px; color: var(--java); font-weight: bold; text-align: center; }

        /* O Hub Central (Dashboard JS) */
        .hub { width: 180px; height: 180px; background: #111; border: 3px solid var(--js); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3; }
        .hub-label { font-size: 0.8em; color: var(--js); font-weight: bold; }

        /* Partículas de Dados (Pacotes WS) */
        .packet { position: absolute; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; filter: blur(2px); z-index: 1; }

        .terminal { background: #000; height: 150px; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.8em; overflow-y: auto; color: #0f0; border: 1px solid #222; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: var(--java); color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0; color: var(--accent);">Visualizador de Tráfego P2P Bridge (Java ↔ JS)</h2>
    <p style="font-size: 0.9em; color: #888;">Simulação de pacotes JSON trafegando via WebSockets na rede local.</p>

    <div class="network-map" id="map">
        <!-- Servidores Java -->
        <div class="node active" id="node1">
            <div style="font-size: 2em;">📱</div>
            <div class="node-label">SERVER JAVA 01<br>Biomecânica</div>
        </div>

        <div class="hub" id="hub">
            <div style="font-size: 2.5em;">🖥️</div>
            <div class="hub-label">HUB JS</div>
            <div style="font-size: 0.6em; color: #555;">CONSENSO</div>
        </div>

        <div class="node active" id="node2">
            <div style="font-size: 2em;">📱</div>
            <div class="node-label">SERVER JAVA 02<br>Termografia</div>
        </div>
    </div>

    <div class="terminal" id="term">
        > Bridge P2P online. Aguardando eventos...
    </div>

    <div class="controls">
        <button class="btn" onclick="sendData(1, 'queda_detectada')">Simular Evento Nó 01</button>
        <button class="btn" onclick="sendData(2, 'calor_anomalo')">Simular Evento Nó 02</button>
        <button class="btn" style="background: var(--js);" onclick="clearTerm()">Limpar Terminal</button>
    </div>
</div>

<script>
    const term = document.getElementById('term');
    const map = document.getElementById('map');
    const hub = document.getElementById('hub');

    function addLog(msg, color = "#0f0") {
        const div = document.createElement('div');
        div.style.color = color;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        term.appendChild(div);
        term.scrollTop = term.scrollHeight;
    }

    function sendData(nodeId, type) {
        const node = document.getElementById(`node${nodeId}`);
        const startRect = node.getBoundingClientRect();
        const endRect = hub.getBoundingClientRect();

        addLog(`Nó 0${nodeId} (JAVA): Gerando pacote JSON via WebSocket...`, "var(--java)");

        // Criar partícula de dado (Pacote)
        for(let i=0; i<3; i++) {
            setTimeout(() => {
                const packet = document.createElement('div');
                packet.className = 'packet';
                packet.style.left = (startRect.left + startRect.width/2) + 'px';
                packet.style.top = (startRect.top + startRect.height/2) + 'px';
                map.appendChild(packet);

                // Animar pacote até o Hub
                packet.animate([
                    { left: (startRect.left + startRect.width/2) + 'px', top: (startRect.top + startRect.height/2) + 'px' },
                    { left: (endRect.left + endRect.width/2) + 'px', top: (endRect.top + endRect.height/2) + 'px' }
                ], {
                    duration: 800,
                    easing: 'ease-in-out'
                }).onfinish = () => {
                    packet.remove();
                    if(i === 2) {
                        addLog(`HUB JS: Recebido payload {event: "${type}"} de Nó 0${nodeId}`, "var(--js)");
                    }
                };
            }, i * 200);
        }
    }

    function clearTerm() { term.innerHTML = "> Aguardando dados..."; }
</script>

</body>
</html>
