<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aprendizado de Matemática</title>
    <style>
        :root { --primary: #4CAF50; --secondary: #2196F3; --error: #f44336; --warning: #ff9800; --bg: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1, h2 { color: #333; margin: 0; text-align: center; width: 100%; }
        .tabs { display: flex; justify-content: flex-start; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; flex-wrap: wrap; gap: 5px;}
        .tab-btn { background: none; border: none; font-size: 13px; font-weight: bold; color: #777; cursor: pointer; padding: 8px 12px; transition: all 0.3s; border-radius: 6px; display: flex; align-items: center; gap: 6px;}
        .tab-btn:hover, .tab-btn.active { color: var(--primary); background: #e8f5e9; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ccc; } /* ⚪ */
        .status-dot.correct { background: var(--primary); } /* ✅ */
        .status-dot.wrong { background: var(--error); } /* ❌ */
        
        .question-layout { display: flex; gap: 20px; margin-bottom: 20px; align-items: stretch; }
        .visual-side { flex: 1; background: #f9f9f9; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; border: 2px solid #eee; }
        .interaction-side { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .svg-container { width: 100%; max-width: 220px; margin-bottom: 10px; }
        .visual-label { font-size: 24px; font-weight: bold; color: #333; margin-top: 10px; text-align: center; }
        .rule-text { font-size: 20px; color: #555; text-align: center; line-height: 1.4; }
        .rule-highlight { color: var(--secondary); font-weight: bold; }
        .rule-x { color: var(--error); font-weight: bold; font-size: 24px; }
        
        .info-panel { background: #e3f2fd; border-left: 5px solid var(--secondary); padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .info-title { font-weight: bold; color: var(--secondary); margin-bottom: 5px; }
        .hint-panel { background: #fff3e0; border-left: 5px solid var(--warning); padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .hint-title { font-weight: bold; color: var(--warning); margin-bottom: 5px; cursor: pointer; }
        .hint-content { display: none; margin-top: 10px; color: #555; } .hint-content.show { display: block; }
        
        .speak-btn { background: none; border: none; font-size: 24px; cursor: pointer; transition: transform 0.2s; }
        .speak-btn:hover { transform: scale(1.2); }
        input[type="number"], input[type="text"], select { font-size: 18px; padding: 10px; border: 2px solid #ccc; border-radius: 8px; outline: none; margin: 5px; text-align: center; }
        input[type="number"]:focus { border-color: var(--secondary); }
        .btn { padding: 12px 20px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; color: white; margin: 5px; transition: opacity 0.2s; font-weight: bold;}
        .btn:hover { opacity: 0.9; }
        .btn-check { background-color: var(--secondary); } .btn-next { background-color: var(--primary); }
        .feedback { font-size: 18px; font-weight: bold; margin-top: 15px; height: 25px; }
        .correct { color: var(--primary); } .wrong { color: var(--error); }
        .progress-bar { width: 100%; background: #ddd; border-radius: 10px; overflow: hidden; margin-bottom: 20px; height: 15px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        /* Status Individual das Questões */
        .question-status { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .q-pip { width: 15px; height: 15px; border-radius: 50%; background: #ddd; border: 2px solid #999; cursor: pointer; transition: 0.2s; }
        .q-pip.current { border-color: var(--secondary); transform: scale(1.2); }
        .q-pip.pip-correct { background: var(--primary); border-color: var(--primary); }
        .q-pip.pip-wrong { background: var(--error); border-color: var(--error); }

        .actions { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; flex-wrap: wrap; gap: 10px;}
        #file-input { display: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal-grid .full-width { grid-column: span 2; }
        .modal-actions { margin-top: 20px; text-align: right; }
        .btn-danger { background-color: var(--error); } .btn-success { background-color: var(--primary); } .btn-add-q { background-color: var(--primary); margin-top: 10px; }

        @media (max-width: 600px) { .question-layout { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Matemática Visual</h1>
    </div>
    
    <div class="tabs" id="tabs"></div>
    <div id="units-container"></div>

    <div class="actions">
        <div>
            <button class="btn btn-success" onclick="openAddUnitModal()">➕ Adicionar Unidade</button>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ Limpar</button>
        </div>
        <div>
            <button class="btn" style="background-color: #ff9800;" onclick="exportStudy()">⬇ Exportar</button>
            <button class="btn" style="background-color: #9c27b0;" onclick="document.getElementById('file-input').click()">⬆ Importar</button>
            <input type="file" id="file-input" accept=".json" onchange="importStudy(event)">
        </div>
    </div>
</div>

<div class="modal-overlay" id="add-unit-modal">
    <div class="modal">
        <h2>Criar Nova Unidade</h2>
        <div class="modal-grid">
            <div class="full-width"><label>Nome:</label><br><input type="text" id="new-unit-name" style="width: 100%;"></div>
            <div><label>Nível:</label><br><select id="new-unit-level" style="width: 100%;"><option value="1">1 - Básico</option><option value="2">2 - Intermediário</option><option value="3">3 - Avançado</option></select></div>
            <div><label>Tipo:</label><br>
                <select id="new-unit-type" style="width: 100%;">
                    <option value="addition">Adição</option><option value="subtraction">Subtração</option>
                    <option value="multiplication">Multiplicação</option><option value="division">Divisão</option>
                    <option value="rule_of_three">Regra de 3</option><option value="fraction">Fração</option>
                    <option value="percentage">Porcentagem</option>
                </select>
            </div>
            <div class="full-width">
                <div style="display: flex; gap: 5px; align-items: center; margin-top: 15px;">
                    <input type="number" id="new-q-a" placeholder="A" style="width: 60px;">
                    <input type="number" id="new-q-b" placeholder="B" style="width: 60px;">
                    <input type="number" id="new-q-c" placeholder="C (p/ Regra 3)" style="width: 90px; display: none;">
                    <button class="btn btn-add-q" onclick="addQuestionToList()">+</button>
                </div>
                <div id="questions-preview" style="margin-top: 10px; font-size: 14px; color: #555;"></div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger" onclick="closeAddUnitModal()">Cancelar</button>
            <button class="btn btn-success" onclick="saveNewUnit()">Salvar</button>
        </div>
    </div>
</div>

<script>
    const mathMeta = {
        addition: { info: "Juntar quantidades.", hint: "Conte para frente." },
        subtraction: { info: "Retirar quantidades.", hint: "Conte para trás." },
        multiplication: { info: "Somar grupos iguais.", hint: "Some o número a si mesmo várias vezes." },
        division: { info: "Dividir em partes iguais.", hint: "Veja quantos cabem." },
        rule_of_three: { info: "Proporção: se um aumenta, o outro aumenta proporcionalmente.", hint: "X = (B × C) ÷ A" },
        fraction: { info: "Partes de um todo. O número de cima (numerador) sobre o total (denominador).", hint: "Divida o todo pelo denominador e conte as partes do numerador." },
        percentage: { info: "Uma taxa ou proporção por cem (%).", hint: "Multiplique o número base pela porcentagem e divida por 100." }
    };

    const defaultMathData = {
        units: {
            "uni-01": { id: "uni-01", name: "Adição", type: "addition", level: 1, questions: [{ a: 3, b: 2, c: null, answered: false, correct: false }, { a: 4, b: 5, c: null, answered: false, correct: false }] },
            "uni-02": { id: "uni-02", name: "Subtração", type: "subtraction", level: 1, questions: [{ a: 5, b: 2, c: null, answered: false, correct: false }, { a: 9, b: 4, c: null, answered: false, correct: false }] },
            "uni-03": { id: "uni-03", name: "Fração", type: "fraction", level: 2, questions: [{ a: 1, b: 2, c: null, answered: false, correct: false }, { a: 3, b: 4, c: null, answered: false, correct: false }] },
            "uni-04": { id: "uni-04", name: "Porcentagem", type: "percentage", level: 2, questions: [{ a: 50, b: 200, c: null, answered: false, correct: false }, { a: 10, b: 80, c: null, answered: false, correct: false }] },
            "uni-05": { id: "uni-05", name: "Regra de 3", type: "rule_of_three", level: 3, questions: [{ a: 2, b: 6, c: 5, d: null, answered: false, correct: false }] }
        }
    };

    let mathData = JSON.parse(localStorage.getItem('mathStudyData')) || JSON.parse(JSON.stringify(defaultMathData));
    let currentUnitId = Object.keys(mathData.units)[0];
    let currentQIndex = 0; // Controle individual da questão

    function calculateAnswer(unitType, a, b, c) {
        switch(unitType) {
            case 'addition': return a + b; case 'subtraction': return a - b;
            case 'multiplication': return a * b; case 'division': return b !== 0 ? a / b : 0;
            case 'rule_of_three': return a !== 0 ? (b * c) / a : 0;
            case 'fraction': return b !== 0 ? a / b : 0; // Valor decimal da fração
            case 'percentage': return (a / 100) * b; // a% de b
            default: return a + b;
        }
    }

    // --- Gerador de SVGs com ANIMAÇÕES ---
    function generateSVG(type, a, b, c) {
        let svgContent = '';
        const animDelay = 0.1;

        if (type === 'addition') {
            let ca = Math.min(a, 8), cb = Math.min(b, 8);
            let circlesA = Array.from({length: ca}, (_, i) => 
                `<circle cx="${20 + (i%4)*30}" cy="${20 + Math.floor(i/4)*30}" r="12" fill="#2196F3" opacity="0">
                    <animate attributeName="opacity" from="0" to="1" begin="${i*animDelay}s" dur="0.3s" fill="freeze"/>
                    <animate attributeName="cy" from="-20" to="${20 + Math.floor(i/4)*30}" begin="${i*animDelay}s" dur="0.3s" fill="freeze"/>
                </circle>`
            ).join('');
            let circlesB = Array.from({length: cb}, (_, i) => 
                `<circle cx="${20 + (i%4)*30}" cy="${90 + Math.floor(i/4)*30}" r="12" fill="#4CAF50" opacity="0">
                    <animate attributeName="opacity" from="0" to="1" begin="${(ca+i)*animDelay}s" dur="0.3s" fill="freeze"/>
                    <animate attributeName="cy" from="160" to="${90 + Math.floor(i/4)*30}" begin="${(ca+i)*animDelay}s" dur="0.3s" fill="freeze"/>
                </circle>`
            ).join('');
            svgContent = `<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">${circlesA}<text x="70" y="75" font-size="24" text-anchor="middle" fill="#333">+</text>${circlesB}</svg>`;
        } 
        else if (type === 'subtraction') {
            let ca = Math.min(a, 8), cb = Math.min(b, ca);
            let circles = Array.from({length: ca}, (_, i) => `<circle cx="${20 + (i%4)*30}" cy="${20 + Math.floor(i/4)*30}" r="12" fill="#2196F3"/>`).join('');
            let crosses = Array.from({length: cb}, (_, i) => {
                let cx = 20 + (i%4)*30, cy = 20 + Math.floor(i/4)*30;
                return `<g opacity="1"><animate attributeName="opacity" from="1" to="0.2" begin="0.5s" dur="0.5s" fill="freeze"/>
                    <line x1="${cx-8}" y1="${cy-8}" x2="${cx+8}" y2="${cy+8}" stroke="red" stroke-width="4"/>
                    <line x1="${cx+8}" y1="${cy-8}" x2="${cx-8}" y2="${cy+8}" stroke="red" stroke-width="4"/></g>`;
            }).join('');
            svgContent = `<svg viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg">${circles}${crosses}</svg>`;
        } 
        else if (type === 'multiplication') {
            let ca = Math.min(a, 4), cb = Math.min(b, 4);
            let rects = '';
            for(let i=0; i<ca; i++) for(let j=0; j<cb; j++) {
                rects += `<rect x="${20 + j*30}" y="${20 + i*30}" width="25" height="25" fill="#9C27B0" rx="3" transform="scale(0)">
                    <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="${(i*cb+j)*0.1}s" dur="0.3s" fill="freeze"/>
                </rect>`;
            }
            svgContent = `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><text x="80" y="15" font-size="12" text-anchor="middle" fill="#666">${ca} grupos de ${cb}</text>${rects}</svg>`;
        } 
        else if (type === 'fraction') {
            // Pizza SVG para Fração (A/B)
            let num = a, den = b;
            if(den > 12) den = 12; // Limite visual
            let paths = '';
            for(let i=0; i<den; i++) {
                let angle = 360/den;
                let startAngle = i * angle - 90;
                let endAngle = startAngle + angle;
                let rad = Math.PI / 180;
                let x1 = 50 + 40 * Math.cos(startAngle * rad);
                let y1 = 50 + 40 * Math.sin(startAngle * rad);
                let x2 = 50 + 40 * Math.cos(endAngle * rad);
                let y2 = 50 + 40 * Math.sin(endAngle * rad);
                let fill = i < num ? "#FF9800" : "#e0e0e0";
                paths += `<path d="M50,50 L${x1},${y1} A40,40 0 0,1 ${x2},${y2} Z" fill="${fill}" stroke="white" stroke-width="2"/>`;
            }
            svgContent = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${paths}<circle cx="50" cy="50" r="40" fill="none" stroke="#333" stroke-width="2"/></svg>`;
        }
        else if (type === 'percentage') {
            // Barra de Progresso SVG (A% de B)
            let perc = Math.min(a, 100);
            svgContent = `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="20" width="180" height="40" fill="#e0e0e0" rx="20"/>
                <rect x="10" y="20" width="0" height="40" fill="#4CAF50" rx="20">
                    <animate attributeName="width" from="0" to="${(perc/100)*180}" dur="1s" fill="freeze" />
                </rect>
                <text x="100" y="45" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">${a}%</text>
            </svg>`;
        }
        else if (type === 'rule_of_three') {
            let ca = a, cb = b, cc = c;
            let maxH = 120; let maxVal = Math.max(ca, cb, cc, 1);
            let hA = (ca/maxVal)*maxH, hB = (cb/maxVal)*maxH, hC = (cc/maxVal)*maxH;
            svgContent = `<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                <rect x="30" y="${150-hA}" width="30" height="${hA}" fill="#2196F3"><animate attributeName="height" from="0" to="${hA}" dur="0.5s" fill="freeze"/><animate attributeName="y" from="150" to="${150-hA}" dur="0.5s" fill="freeze"/></rect>
                <rect x="80" y="${150-hB}" width="30" height="${hB}" fill="#4CAF50"><animate attributeName="height" from="0" to="${hB}" dur="0.7s" fill="freeze"/><animate attributeName="y" from="150" to="${150-hB}" dur="0.7s" fill="freeze"/></rect>
                <rect x="130" y="${150-hC}" width="30" height="${hC}" fill="#FF9800"><animate attributeName="height" from="0" to="${hC}" dur="0.9s" fill="freeze"/><animate attributeName="y" from="150" to="${150-hC}" dur="0.9s" fill="freeze"/></rect>
                <rect x="180" y="20" width="30" height="110" fill="#eee" stroke="red" stroke-dasharray="5,5" stroke-width="2">
                    <animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
                </rect>
                <text x="195" y="15" text-anchor="middle" fill="red" font-weight="bold">X</text>
            </svg>`;
        }

        return `<div class="svg-container">${svgContent}</div>`;
    }

    function initUI() { renderTabs(); renderUnit(currentUnitId); }

    function renderTabs() {
        const tabsDiv = document.getElementById('tabs');
        tabsDiv.innerHTML = '';
        Object.keys(mathData.units).sort((a,b) => mathData.units[a].level - mathData.units[b].level).forEach(uid => {
            const unit = mathData.units[uid];
            // Lógica do Status Individual da Unidade (✅❌⚪)
            let dotClass = '';
            const allAnswered = unit.questions.every(q => q.answered);
            const someWrong = unit.questions.some(q => q.answered && !q.correct);
            if (allAnswered && !someWrong) dotClass = 'correct';
            else if (someWrong) dotClass = 'wrong';

            const btn = document.createElement('button');
            btn.className = `tab-btn ${uid === currentUnitId ? 'active' : ''}`;
            btn.innerHTML = `${unit.name} <span class="status-dot ${dotClass}"></span>`;
            btn.onclick = () => { currentUnitId = uid; currentQIndex = 0; initUI(); };
            tabsDiv.appendChild(btn);
        });
    }

    function renderUnit(unitId) {
        if(!mathData.units[unitId]) currentUnitId = Object.keys(mathData.units)[0];
        const unit = mathData.units[unitId];
        const container = document.getElementById('units-container');
        
        // Achar a próxima questão não respondida, ou manter a atual
        let nextUnanswered = unit.questions.findIndex(q => !q.answered);
        if(nextUnanswered !== -1) currentQIndex = nextUnanswered;
        else if(currentQIndex >= unit.questions.length) currentQIndex = unit.questions.length - 1;

        const q = unit.questions[currentQIndex];
        const totalQ = unit.questions.length;
        const answeredQ = unit.questions.filter(q => q.answered).length;
        const progressPercent = totalQ > 0 ? (answeredQ / totalQ) * 100 : 0;
        
        const meta = mathMeta[unit.type] || { info: "Sem info", hint: "Sem dica" };
        const svg = generateSVG(unit.type, q.a, q.b, q.c);
        
        let visualText = "";
        if (unit.type === 'rule_of_three') visualText = `<div class="rule-text">Se <span class="rule-highlight">${q.a}</span>, então <span class="rule-highlight">${q.b}</span>.<br>Se <span class="rule-highlight">${q.c}</span>, então <span class="rule-x">X</span>?</div>`;
        else if (unit.type === 'fraction') visualText = `<div class="visual-label">${q.a}/${q.b} = ?</div>`;
        else if (unit.type === 'percentage') visualText = `<div class="visual-label">${q.a}% de ${q.b} = ?</div>`;
        else visualText = `<div class="visual-label">${q.a} ${mathMeta[unit.type]?.symbol || '?'} ${q.b} = ?</div>`;

        // Gerar Pips de Status (Indicador Individual de Questões)
        let pipsHtml = unit.questions.map((pq, idx) => {
            let cls = 'q-pip';
            if(idx === currentQIndex) cls += ' current';
            if(pq.answered && pq.correct) cls += ' pip-correct';
            else if(pq.answered && !pq.correct) cls += ' pip-wrong';
            return `<div class="${cls}" onclick="jumpToQuestion(${idx})"></div>`;
        }).join('');

        container.innerHTML = `
            <h2 style="margin-bottom:15px">${unit.name}</h2>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
            
            <div class="info-panel"><div class="info-title">📖 O que é?</div>${meta.info}</div>
            <div class="hint-panel"><div class="hint-title" onclick="toggleHint()">💡 Dica <span id="hint-toggle-text">[Mostrar]</span></div><div id="hint-content" class="hint-content">${meta.hint}</div></div>

            <div class="question-layout">
                <div class="visual-side">${svg}${visualText}</div>
                <div class="interaction-side">
                    <button class="speak-btn" onclick="speakQuestion('${unit.type}', ${q.a}, ${q.b}, ${q.c || 0})">🔊</button>
                    <br><br>
                    <input type="number" id="answer-input" placeholder="Resposta" step="any" ${q.answered ? 'disabled' : ''} value="${q.answered ? calculateAnswer(unit.type, q.a, q.b, q.c).toFixed(2).replace('.00','') : ''}">
                    <br>
                    ${!q.answered ? `<button class="btn btn-check" onclick="checkAnswer()">Verificar</button>` : ''}
                    <div id="feedback" class="feedback"></div>
                    ${q.answered ? `<button class="btn btn-next" onclick="nextQuestion()">Próxima</button>` : ''}
                </div>
            </div>
            <div class="question-status">${pipsHtml}</div>
        `;

        if(q.answered) {
            const fb = document.getElementById('feedback');
            fb.className = `feedback ${q.correct ? 'correct' : 'wrong'}`;
            fb.innerText = q.correct ? "Correto!" : `Errado! Resposta: ${calculateAnswer(unit.type, q.a, q.b, q.c).toFixed(2).replace('.00','')}`;
        }
        if(!q.answered) document.getElementById('answer-input').focus();
    }

    function jumpToQuestion(index) { currentQIndex = index; renderUnit(currentUnitId); }
    function toggleHint() { const c = document.getElementById('hint-content'); const t = document.getElementById('hint-toggle-text'); c.classList.toggle('show'); t.innerText = c.classList.contains('show') ? '[Esconder]' : '[Mostrar]'; }
    function speakQuestion(type, a, b, c) { if ('speechSynthesis' in window) { let t = ""; if(type==='rule_of_three') t=`Se ${a}, então ${b}. Se ${c}, então quanto?`; else if(type==='fraction') t=`Qual o valor de ${a} sobre ${b}?`; else if(type==='percentage') t=`Quanto é ${a} por cento de ${b}?`; else t=`Quanto é ${a} ${type==='addition'?'mais':type==='subtraction'?'menos':'vezes'} ${b}?`; const u = new SpeechSynthesisUtterance(t); u.lang='pt-BR'; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } }

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = parseFloat(input.value);
        if(isNaN(userAnswer)) { alert("Digite um número."); return; }
        const unit = mathData.units[currentUnitId];
        const q = unit.questions[currentQIndex];
        q.answered = true;
        q.correct = (Math.abs(userAnswer - calculateAnswer(unit.type, q.a, q.b, q.c)) < 0.05);
        saveData(); renderUnit(currentUnitId); renderTabs(); // Atualiza a aba também
    }

    function nextQuestion() {
        const unit = mathData.units[currentUnitId];
        let nextIdx = unit.questions.findIndex(q => !q.answered);
        if (nextIdx !== -1) { currentQIndex = nextIdx; renderUnit(currentUnitId); }
        else {
            const ids = Object.keys(mathData.units).sort((a,b) => mathData.units[a].level - mathData.units[b].level);
            const nextUnitIdx = ids.indexOf(currentUnitId) + 1;
            if(nextUnitIdx < ids.length) { currentUnitId = ids[nextUnitIdx]; currentQIndex = 0; initUI(); }
        }
    }

    // --- Sistema de Dados e Modal ---
    function clearAllData() { if(confirm("Apagar progresso?")) { localStorage.removeItem('mathStudyData'); mathData = JSON.parse(JSON.stringify(defaultMathData)); currentUnitId = Object.keys(mathData.units)[0]; currentQIndex=0; initUI(); } }
    function saveData() { localStorage.setItem('mathStudyData', JSON.stringify(mathData)); }
    function exportStudy() { const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mathData, null, 2)); const a = document.createElement('a'); a.href=d; a.download="math.json"; a.click(); }
    function importStudy(event) { const file = event.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = e => { try { mathData = JSON.parse(e.target.result); saveData(); currentUnitId = Object.keys(mathData.units)[0]; currentQIndex=0; initUI(); } catch(e){alert("Erro");} }; r.readAsText(file); }
    
    function openAddUnitModal() { document.getElementById('add-unit-modal').classList.add('active'); }
    function closeAddUnitModal() { document.getElementById('add-unit-modal').classList.remove('active'); }
    
    let tempNewQuestions = [];
    function addQuestionToList() {
        const a = parseFloat(document.getElementById('new-q-a').value);
        const b = parseFloat(document.getElementById('new-q-b').value);
        const type = document.getElementById('new-unit-type').value;
        if(isNaN(a)||isNaN(b)) return alert("Preencha A e B");
        tempNewQuestions.push({ a, b, c: null, d: null, answered: false, correct: false });
        document.getElementById('questions-preview').innerHTML += `<span style="background:#eee; padding:5px; margin:2px; display:inline-block">${a} e ${b} <button onclick="this.parentElement.remove()" style="color:red; border:none; cursor:pointer;">X</button></span>`;
    }
    function saveNewUnit() {
        const name = document.getElementById('new-unit-name').value.trim();
        const level = parseInt(document.getElementById('new-unit-level').value);
        const type = document.getElementById('new-unit-type').value;
        if(!name || tempNewQuestions.length === 0) return alert("Preencha nome e perguntas");
        mathData.units[`custom-${Date.now()}`] = { id: `custom-${Date.now()}`, name, type, level, questions: [...tempNewQuestions] };
        tempNewQuestions = []; saveData(); closeAddUnitModal(); initUI();
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !document.getElementById('add-unit-modal').classList.contains('active')) { const unit = mathData.units[currentUnitId]; if(unit && !unit.questions[currentQIndex].answered) checkAnswer(); } });

    initUI();
</script>
</body>
</html>
