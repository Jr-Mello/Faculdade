<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Pro - Tutor Adaptativo Avançado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #e0e7ff;
            --enem-blue: #003366; --enem-gold: #D4A017; --enem-bg: #f0f2f5;
            --correct: #2e7d32; --wrong: #c62828; --card-bg: #ffffff;
            --review-color: #f59e0b;
            --bg: #f3f4f6; --text-primary: #1f2937; --text-secondary: #6b7280;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }

        .main-container { display: flex; width: 100%; height: 100%; }
        .chat-section { flex: 1; display: flex; flex-direction: column; background: white; border-right: 1px solid #e5e7eb; z-index: 10; }
        .exam-section { width: 0; overflow: hidden; transition: width 0.3s ease; background: var(--enem-bg); }
        .exam-section.open { width: 50%; overflow-y: auto; }

        /* Chat Interface */
        .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background: white; z-index: 20; }
        .chat-header h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; }
        .header-btn { background: #f3f4f6; border: none; padding: 0.5rem 0.75rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .header-btn:hover { background: #e5e7eb; }
        .user-level { background: var(--primary-light); color: var(--primary); font-weight: 700; font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 1rem; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; background: #f9fafb; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.875rem; line-height: 1.5; box-shadow: var(--shadow-sm); position: relative; }
        .message.bot { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
        .message.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .message-time { font-size: 0.625rem; opacity: 0.6; margin-top: 0.25rem; text-align: right; }
        
        .chat-input-area { padding: 1rem; background: white; border-top: 1px solid #e5e7eb; }
        .input-group { display: flex; gap: 0.5rem; }
        .chat-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
        .chat-input:focus { border-color: var(--primary); }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 1rem; border-radius: 0.5rem; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: var(--primary-dark); }
        
        .chips { display: flex; gap: 0.5rem; margin-top: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
        .chip { background: white; border: 1px solid #d1d5db; padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .chip:hover { background: var(--primary-light); border-color: var(--primary); }

        /* Exam Simulator Styles */
        .exam-container { padding: 2rem; height: 100%; display: flex; flex-direction: column; }
        .exam-card { background: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: var(--shadow-md); margin-bottom: 1rem; }
        .exam-header-bar { background: var(--enem-blue); color: white; padding: 1rem; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .timer { font-family: monospace; font-size: 1.25rem; background: rgba(0,0,0,0.2); padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
        .question-context { background: #e8eaf6; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; border-left: 4px solid var(--enem-blue); font-size: 0.875rem; }
        .question-stem { font-weight: 600; margin-bottom: 1rem; }
        .alt-btn { background: #f5f5f5; border: 1px solid #ddd; padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 0.75rem; width: 100%; margin-bottom: 0.5rem; transition: all 0.2s; }
        .alt-btn:hover { border-color: var(--enem-blue); background: #e3f2fd; }
        .alt-btn.selected { border-color: var(--enem-blue); background: #bbdefb; font-weight: bold; }
        .alt-btn.correct-answer { border-color: var(--correct); background: #c8e6c9; color: var(--correct); font-weight: bold; pointer-events: none; }
        .alt-btn.wrong-answer { border-color: var(--wrong); background: #ffcdd2; color: var(--wrong); text-decoration: line-through; pointer-events: none; }
        .alt-letter { width: 24px; height: 24px; border-radius: 50%; background: #ddd; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.75rem; flex-shrink: 0; }
        .alt-btn.selected .alt-letter { background: var(--enem-blue); color: white; }
        
        /* Review & Tutor Controls */
        .question-controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .control-box { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; border: 1px solid; }
        .review-control { background: #fffbeb; border-color: #fde68a; color: #b45309; }
        .review-control:hover { background: #fef3c7; }
        .review-control input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--review-color); }
        .tutor-control { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
        .tutor-control:hover { background: #dbeafe; }
        
        .resolution-panel { background: #fff3e0; border-left: 4px solid var(--enem-gold); padding: 1rem; margin-top: 1rem; border-radius: 0.5rem; display: none; font-size: 0.875rem; white-space: pre-wrap; }
        .confidence-box { margin-top: 1rem; padding: 1rem; background: #f8fafc; border-radius: 0.5rem; border: 1px solid #e2e8f0; display: none; }
        .confidence-slider { width: 100%; cursor: pointer; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; color: white; transition: opacity 0.2s; width: 100%; }
        .btn:hover { opacity: 0.9; }
        .btn-confirm { background: var(--correct); margin-top: 0.5rem; }
        .btn-next { background: var(--enem-blue); margin-top: 0.5rem; display: none; }
        .btn-finish { background: var(--wrong); margin-top: 0.5rem; }
        .btn-review { background: var(--review-color); margin-top: 0.5rem; }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1rem; }
        .nav-dot { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.625rem; position: relative; }
        .nav-dot.current { border-color: var(--enem-blue); background: #bbdefb; }
        .nav-dot.correct-dot { background: var(--correct); color: white; border-color: var(--correct); }
        .nav-dot.wrong-dot { background: var(--wrong); color: white; border-color: var(--wrong); }
        .nav-dot.review-dot::after { content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; background: var(--review-color); border-radius: 50%; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 500px; box-shadow: 0 20px 25px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 1rem; font-size: 1.25rem; }
        .modal-section { border-top: 1px solid #e5e7eb; padding-top: 1.5rem; margin-top: 1.5rem; }
        .modal-section:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
        .modal-section h3 { font-size: 1rem; color: var(--enem-blue); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .modal-section p { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem; }
        .modal-actions { display: flex; flex-direction: column; gap: 0.75rem; }
        .modal-btn { padding: 0.75rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; color: white; background: var(--primary); transition: background 0.2s; text-align: center; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        .modal-btn:hover { background: var(--primary-dark); }
        .modal-btn.danger { background: #ef4444; }
        .modal-btn.secondary { background: #6b7280; }
        .modal-btn.enem { background: var(--enem-blue); }
        .file-input { display: none; }

        @media (max-width: 768px) {
            .exam-section.open { width: 100%; position: absolute; z-index: 50; height: 100%; left: 0; top: 0; }
            .chat-section { width: 100%; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="chat-section">
        <div class="chat-header">
            <h1><i class="fas fa-brain" style="color: var(--primary)"></i> IA Pro</h1>
            <div class="header-actions">
                <span class="user-level" id="user-level-display">Nv 1</span>
                <button class="header-btn" onclick="toggleExamPanel()" title="Simulado ENEM"><i class="fas fa-file-alt"></i> ENEM</button>
                <button class="header-btn" onclick="toggleDataModal()" title="Dados"><i class="fas fa-database"></i> Dados</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-container"></div>

        <div class="chat-input-area">
            <form id="chat-form" onsubmit="handleChatSubmit(event)" class="input-group">
                <input type="text" id="user-input" class="chat-input" placeholder="Pergunte ou digite 'dica'..." autocomplete="off">
                <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </form>
            <div class="chips">
                <div class="chip" onclick="fillInput('Preciso revisar, o que eu estudo hoje?')">📅 Revisar</div>
                <div class="chip" onclick="fillInput('Quero uma questão de Juros Compostos')">🧮 Questão</div>
                <div class="chip" onclick="fillInput('Estou com dificuldade')">🆘 Dificuldade</div>
                <div class="chip" onclick="fillInput('Abrir simulado ENEM')">📝 Simulado</div>
            </div>
        </div>
    </div>

    <div class="exam-section" id="exam-panel">
        <div class="exam-container" id="exam-root"></div>
    </div>
</div>

<div class="modal-overlay" id="data-modal">
    <div class="modal">
        <h2><i class="fas fa-database"></i> Gerenciamento de Dados</h2>
        <div class="modal-section">
            <h3><i class="fas fa-user-graduate"></i> Perfil e Progresso</h3>
            <div class="modal-actions">
                <button class="modal-btn" onclick="exportUserData()"><i class="fas fa-download"></i> Exportar Dados</button>
                <label class="modal-btn secondary" for="import-user-file">
                    <i class="fas fa-upload"></i> Importar Dados
                    <input type="file" id="import-user-file" class="file-input" accept=".json" onchange="importUserData(event)">
                </label>
            </div>
        </div>
        <div class="modal-section">
            <h3><i class="fas fa-book-open"></i> Banco de Questões</h3>
            <div class="modal-actions">
                <button class="modal-btn enem" onclick="exportQuestions()"><i class="fas fa-file-export"></i> Exportar Questões</button>
                <label class="modal-btn enem" style="background: #004488;" for="import-questions-file">
                    <i class="fas fa-file-import"></i> Importar Novas Questões
                    <input type="file" id="import-questions-file" class="file-input" accept=".json" onchange="importQuestions(event)">
                </label>
            </div>
        </div>
        <div class="modal-section">
            <div class="modal-actions">
                <button class="modal-btn danger" onclick="clearAllData()"><i class="fas fa-trash"></i> Limpar Todos os Dados</button>
                <button class="modal-btn secondary" onclick="toggleDataModal()"><i class="fas fa-times"></i> Fechar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let enemDatabase = JSON.parse(localStorage.getItem('ia_pro_questions')) || [];

    const defaultState = {
        chatHistory: [],
        userProfile: { name: null, level: 1, xp: 0, xpToNextLevel: 100 },
        learningAnalytics: { topics: {} },
        examState: { currentExam: null, currentQuestionIndex: 0, answers: {}, timeRemaining: 0 },
        reviewList: []
    };

    let state = JSON.parse(localStorage.getItem('ia_pro_state')) || JSON.parse(JSON.stringify(defaultState));
    let timerInterval = null;
    let questionStartTime = null;
    let currentViewedQuestion = null; // Guarda a questão atual para o Tutor

    const container = document.getElementById('chat-container');
    const inputField = document.getElementById('user-input');

    // ======================================================================
    // LÓGICA DO CHATBOT COM TUTOR INTEGRADO
    // ======================================================================
    function processResponse(input) {
        const lowInput = input.toLowerCase();
        
        // 1. Intenção do Tutor (Prioridade Máxima)
        if (lowInput.includes('como desenvolvo') || lowInput.includes('como resolvo') || lowInput.includes('como faço') || lowInput.includes('me ensina')) {
            if (currentViewedQuestion) {
                const q = currentViewedQuestion;
                return `🧠 **Passo a Passo para a Questão ${q.id}:**\n\n1️⃣ **Entenda o Contexto:** ${q.context}\n2️⃣ **Identifique o que se pede:** O problema quer saber "${q.stem}"\n3️⃣ **Estratégia:** Leia as alternativas e tente eliminar as absurdas primeiro. Identifique se é regra de 3, porcentagem, juros ou geometria.\n4️⃣ **Execução:** Tente montar a conta no papel. Se travar, confirme a resposta no simulado para ver a resolução detalhada!\n\n💡 *Dica:* Se ainda estiver confuso, me diga qual parte específica está difícil!`;
            }
            return "Nenhuma questão selecionada no momento. Abra o simulado e clique em '🤖 Perguntar ao Tutor' em alguma questão!";
        }

        if (['não entendi', 'difícil', 'dificuldade', 'confuso', 'desistir'].some(k => lowInput.includes(k))) {
            return "Não se preocupe, é normal achar difícil! 🤝 Se estiver no simulado, clique em '🤖 Perguntar ao Tutor' que te guio pelo passo a passo!";
        }

        if (['revisar', 'estudo hoje', 'o que eu estudo'].some(k => lowInput.includes(k))) {
            if(state.reviewList.length > 0) {
                toggleExamPanel(true);
                return `📅 Você tem **${state.reviewList.length}** questões marcadas para revisão! Abri o simulado e já deixei o modo revisão disponível.`;
            }
            return "Você não marcou nenhuma questão para revisão ainda. 📝 Durante o simulado, marque o ícone de favorito nas questões que deseja refazer!";
        }

        if (lowInput.includes('questão') || lowInput.includes('exercício') || lowInput.includes('simulado')) {
            if(enemDatabase.length === 0) return "⚠️ O banco de questões está vazio! Vá em 'Dados' > 'Importar Novas Questões' para carregar o JSON.";
            toggleExamPanel(true);
            return "Abri o painel do simulado para você! Escolha uma fase ou inicie a revisão. 📝";
        }

        if (!state.userProfile.name && (lowInput.includes('oi') || lowInput.includes('olá'))) {
            return "Olá! Eu sou o IA Pro, seu tutor adaptativo. Qual é o seu nome?";
        }
        if (!state.userProfile.name && lowInput.length > 0) {
            state.userProfile.name = input.split(' ').pop().replace(/[?!.]/g, '');
            saveState();
            updateLevelUI();
            return `Prazer, ${state.userProfile.name}! 🚀 Estou aqui para ajudar. Me diga se quer revisar algo ou praticar questões!`;
        }

        return "Posso te ajudar a estudar! Digite 'revisar' ou 'simulado'. Se não houver questões, importe pelo menu Dados.";
    }

    function createBubble(text, sender) {
        const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const bubble = document.createElement('div');
        bubble.className = `message ${sender}`;
        const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        bubble.innerHTML = `${formattedText}<div class="message-time">${timeStr}</div>`;
        container.appendChild(bubble);
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        
        state.chatHistory.push({ text, sender, time: Date.now() });
        if(state.chatHistory.length > 30) state.chatHistory.shift();
        saveState();
    }

    async function handleChatSubmit(e) {
        e.preventDefault();
        const text = inputField.value.trim();
        if (!text) return;
        inputField.value = '';
        createBubble(text, 'user');

        const typingBubble = document.createElement('div');
        typingBubble.className = 'message bot';
        typingBubble.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
        container.appendChild(typingBubble);

        setTimeout(() => {
            container.removeChild(typingBubble);
            const response = processResponse(text);
            createBubble(response, 'bot');
        }, 600 + Math.random() * 400);
    }

    // Função chamada pelo botão no simulado
    function askTutor() {
        if(!currentViewedQuestion) return;
        const q = currentViewedQuestion;
        const msg = `Como desenvolvo a questão: "${q.stem}"`;
        fillInput(msg);
        // Auto-envia
        setTimeout(() => document.getElementById('chat-form').dispatchEvent(new Event('submit')), 100);
    }

    function fillInput(text) { inputField.value = text; inputField.focus(); }

    function loadChatHistory() {
        container.innerHTML = '';
        if (state.chatHistory.length === 0) {
            createBubble("Olá! Eu sou o IA Pro. Qual é o seu nome? (Dica: Importe as questões no menu Dados)", 'bot');
        } else {
            state.chatHistory.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `message ${msg.sender}`;
                bubble.innerHTML = `${msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}<div class="message-time">${new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }
        updateLevelUI();
    }

    function updateLevelUI() { document.getElementById('user-level-display').innerText = `Nv ${state.userProfile.level}`; }

    // ======================================================================
    // SISTEMA DO SIMULADOR ENEM
    // ======================================================================
    function toggleExamPanel(forceOpen = false) {
        const panel = document.getElementById('exam-panel');
        if (forceOpen && !panel.classList.contains('open')) panel.classList.add('open');
        else panel.classList.toggle('open');
        if (panel.classList.contains('open')) showLanding();
    }

    function showLanding() {
        clearInterval(timerInterval);
        const root = document.getElementById('exam-root');
        if(enemDatabase.length === 0) {
            root.innerHTML = `<div class="exam-card" style="text-align: center;"><h2 style="color: var(--wrong);">Nenhuma Questão Importada</h2><p style="margin-top:1rem;">Vá em Dados > Importar Novas Questões.</p></div>`;
            return;
        }
        const reviewCount = state.reviewList.length;
        root.innerHTML = `
            <div class="exam-card" style="text-align: center;">
                <h2 style="color: var(--enem-blue); margin-bottom: 1rem;">Simulado ENEM</h2>
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
                    ${enemDatabase.map(exam => `<button class="btn" style="background: var(--enem-blue);" onclick="startExam('${exam.id}')">${exam.title} (${exam.questions.length} questões)</button>`).join('')}
                    <button class="btn btn-review" onclick="startReviewMode()" ${reviewCount === 0 ? 'disabled style="background: #ccc; cursor: not-allowed;"' : ''}>🔄 Modo Revisão (${reviewCount} questões)</button>
                    ${reviewCount > 0 ? `<button class="btn" style="background: #6b7280; font-size: 0.8rem;" onclick="clearReviewList()">Limpar Lista de Revisão</button>` : ''}
                </div>
            </div>
        `;
    }

    function getQuestions(examId) {
        if(examId === 'review_mode') {
            let reviewQuestions = [];
            enemDatabase.forEach(exam => exam.questions.forEach(q => { if(state.reviewList.includes(q.id)) reviewQuestions.push(q); }));
            return reviewQuestions;
        }
        return enemDatabase.find(e => e.id === examId)?.questions || [];
    }

    function startExam(examId) {
        const exam = enemDatabase.find(e => e.id === examId);
        state.examState = { currentExam: examId, currentQuestionIndex: 0, answers: {}, timeRemaining: (exam?.timeLimit || 60) * 60 };
        saveState();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
        showQuestion();
    }

    function startReviewMode() {
        if(state.reviewList.length === 0) return alert("Nenhuma questão marcada para revisão!");
        state.examState = { currentExam: 'review_mode', currentQuestionIndex: 0, answers: {}, timeRemaining: 3600 };
        saveState();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
        showQuestion();
    }

    function clearReviewList() {
        if(confirm("Limpar lista de revisão?")) { state.reviewList = []; saveState(); showLanding(); }
    }

    function showQuestion() {
        const questions = getQuestions(state.examState.currentExam);
        if(!questions.length) return showLanding();
        const qIndex = state.examState.currentQuestionIndex;
        const question = questions[qIndex];
        const answerData = state.examState.answers[`${state.examState.currentExam}-${question.id}`];
        const isReview = state.reviewList.includes(question.id);
        
        currentViewedQuestion = question; // Atualiza referência para o Tutor
        questionStartTime = Date.now();

        const examTitle = state.examState.currentExam === 'review_mode' ? "Modo Revisão" : (enemDatabase.find(e => e.id === state.examState.currentExam)?.title || "Simulado");

        const root = document.getElementById('exam-root');
        root.innerHTML = `
            <div class="exam-header-bar">
                <div><strong>${examTitle} - Q${qIndex + 1}/${questions.length}</strong></div>
                <div class="timer">${formatTime(state.examState.timeRemaining)}</div>
            </div>
            <div class="exam-card">
                <div class="question-context">${question.context}</div>
                <div class="question-stem">${question.stem}</div>
                
                ${question.options.map(opt => `
                    <div class="alt-btn ${answerData?.letter === opt.letter ? 'selected' : ''}" onclick="selectAnswer('${opt.letter}')">
                        <div class="alt-letter">${opt.letter}</div>
                        <div>${opt.text}</div>
                    </div>
                `).join('')}
                
                <div class="question-controls">
                    <div class="control-box review-control" onclick="toggleReviewQuestion(${question.id})">
                        <input type="checkbox" id="reviewCheck" ${isReview ? 'checked' : ''}> 
                        <label for="reviewCheck"><i class="fas fa-bookmark"></i> Revisar</label>
                    </div>
                    <div class="control-box tutor-control" onclick="askTutor()">
                        <i class="fas fa-robot"></i> Perguntar ao Tutor
                    </div>
                </div>

                <div class="confidence-box" id="confidence-box">
                    <label>Quão confiante você está? (<span id="conf-val">50</span>%)</label>
                    <input type="range" class="confidence-slider" min="0" max="100" value="50" oninput="document.getElementById('conf-val').innerText=this.value">
                </div>

                <div class="resolution-panel" id="resolution-box"><strong>Resolução:</strong><br>${question.resolution}</div>

                <button class="btn btn-confirm" id="btn-confirm" onclick="confirmAnswer()">Confirmar Resposta</button>
                <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Próxima Questão</button>
                <button class="btn btn-finish" onclick="finishExam()">Finalizar Prova</button>
            </div>
            
            <div class="exam-card">
                <h3 style="margin-bottom:0.5rem; font-size:0.9rem; color:var(--enem-blue);">Navegação</h3>
                <div class="nav-grid">
                    ${questions.map((q, i) => {
                        const ansKey = `${state.examState.currentExam}-${q.id}`;
                        const ans = state.examState.answers[ansKey];
                        const isRev = state.reviewList.includes(q.id);
                        let cls = 'nav-dot';
                        if(i === qIndex) cls += ' current';
                        else if(ans?.letter === q.correct) cls += ' correct-dot';
                        else if(ans?.letter) cls += ' wrong-dot';
                        if(isRev) cls += ' review-dot';
                        return `<div class="${cls}" onclick="goToQuestion(${i})">${i + 1}</div>`;
                    }).join('')}
                </div>
            </div>
        `;
    }

    function toggleReviewQuestion(qId) {
        const index = state.reviewList.indexOf(qId);
        if(index > -1) state.reviewList.splice(index, 1);
        else state.reviewList.push(qId);
        saveState();
        showQuestion();
    }

    function selectAnswer(letter) {
        const questions = getQuestions(state.examState.currentExam);
        const qId = questions[state.examState.currentQuestionIndex].id;
        const key = `${state.examState.currentExam}-${qId}`;
        if(!state.examState.answers[key]) state.examState.answers[key] = { letter: null, timeSpent: 0, confidence: 0 };
        state.examState.answers[key].letter = letter;
        saveState();
        document.getElementById('confidence-box').style.display = 'block';
        showQuestion();
    }

    function confirmAnswer() {
        const questions = getQuestions(state.examState.currentExam);
        const question = questions[state.examState.currentQuestionIndex];
        const key = `${state.examState.currentExam}-${question.id}`;
        const userAnswer = state.examState.answers[key]?.letter;

        if (!userAnswer) return alert("Selecione uma alternativa!");

        const timeSpent = Math.round((Date.now() - questionStartTime) / 1000);
        const confidence = parseInt(document.querySelector('.confidence-slider')?.value || 50);
        state.examState.answers[key].timeSpent = timeSpent;
        state.examState.answers[key].confidence = confidence / 100;

        const isCorrect = userAnswer === question.correct;
        const topic = question.tags?.[0] || "Geral";
        if(!state.learningAnalytics.topics[topic]) state.learningAnalytics.topics[topic] = { mastery: 0, lastPracticed: null, nextReview: null };
        
        let currentMastery = state.learningAnalytics.topics[topic].mastery;
        state.learningAnalytics.topics[topic].mastery = isCorrect ? Math.min(1, currentMastery + 0.1) : Math.max(0, currentMastery - 0.05);
        state.learningAnalytics.topics[topic].lastPracticed = new Date().toISOString().split('T')[0];
        
        const interval = isCorrect ? (currentMastery < 0.5 ? 1 : 3) : 1;
        const nextReviewDate = new Date();
        nextReviewDate.setDate(nextReviewDate.getDate() + interval);
        state.learningAnalytics.topics[topic].nextReview = nextReviewDate.toISOString().split('T')[0];

        state.userProfile.xp += isCorrect ? 50 : 10;
        if(state.userProfile.xp >= state.userProfile.xpToNextLevel) {
            state.userProfile.level++;
            state.userProfile.xp = 0;
            state.userProfile.xpToNextLevel = Math.round(state.userProfile.xpToNextLevel * 1.5);
            createBubble(`🎉 Parabéns! Você subiu para o **Nível ${state.userProfile.level}**!`, 'bot');
        }
        updateLevelUI();
        saveState();

        document.querySelectorAll('.alt-btn').forEach(btn => {
            const letter = btn.querySelector('.alt-letter').textContent;
            if(letter === question.correct) btn.classList.add('correct-answer');
            else if(letter === userAnswer && letter !== question.correct) btn.classList.add('wrong-answer');
        });

        document.getElementById('resolution-box').style.display = 'block';
        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
        document.getElementById('confidence-box').style.display = 'none';
    }

    function nextQuestion() {
        const questions = getQuestions(state.examState.currentExam);
        if (state.examState.currentQuestionIndex < questions.length - 1) {
            state.examState.currentQuestionIndex++;
            saveState();
            showQuestion();
        } else { finishExam(); }
    }

    function goToQuestion(index) { state.examState.currentQuestionIndex = index; saveState(); showQuestion(); }

    function finishExam() {
        clearInterval(timerInterval);
        let correct = 0, total = 0;
        const questions = getQuestions(state.examState.currentExam);
        questions.forEach(q => {
            const ans = state.examState.answers[`${state.examState.currentExam}-${q.id}`];
            if(ans?.letter) { total++; if(ans.letter === q.correct) correct++; }
        });
        const pct = total > 0 ? Math.round((correct/total)*100) : 0;
        document.getElementById('exam-root').innerHTML = `
            <div class="exam-card" style="text-align:center;">
                <h2 style="color: var(--enem-blue);">Resultado Final</h2>
                <div style="font-size:3rem; font-weight:bold; color:${pct >= 50 ? 'var(--correct)' : 'var(--wrong)'}; margin:1rem 0;">${pct}%</div>
                <p><strong>${correct}</strong> Acertos | <strong>${total}</strong> Respondidas</p>
                <button class="btn" style="background: var(--enem-blue); margin-top:1rem;" onclick="resetExam()">Voltar ao Início</button>
            </div>
        `;
    }

    function resetExam() { state.examState = { currentExam: null, currentQuestionIndex: 0, answers: {}, timeRemaining: 0 }; saveState(); showLanding(); }

    function updateTimer() {
        if(state.examState.timeRemaining > 0) {
            state.examState.timeRemaining--;
            const timerEl = document.querySelector('.timer');
            if(timerEl) timerEl.textContent = formatTime(state.examState.timeRemaining);
        } else { finishExam(); }
    }

    function formatTime(seconds) { return `${Math.floor(seconds/60).toString().padStart(2, '0')}:${(seconds%60).toString().padStart(2, '0')}`; }

    // ======================================================================
    // SISTEMA DE IMPORTAÇÃO/EXPORTAÇÃO
    // ======================================================================
    function toggleDataModal() { document.getElementById('data-modal').classList.toggle('active'); }

    function exportUserData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `ia_pro_backup_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
        a.click(); URL.revokeObjectURL(a.href);
    }

    function importUserData(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.userProfile) state.userProfile = data.userProfile;
                if(data.chatHistory) state.chatHistory = data.chatHistory;
                if(data.examState) state.examState = data.examState;
                if(data.learningAnalytics) state.learningAnalytics = data.learningAnalytics;
                if(data.reviewList) state.reviewList = data.reviewList;
                saveState(); location.reload();
            } catch (error) { alert("Erro ao importar: arquivo JSON inválido."); }
        };
        reader.readAsText(file); event.target.value = '';
    }

    function exportQuestions() {
        const blob = new Blob([JSON.stringify(enemDatabase, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `ia_pro_questoes_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
        a.click(); URL.revokeObjectURL(a.href);
    }

    function importQuestions(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && data.length > 0 && data[0].questions) {
                    enemDatabase = data; localStorage.setItem('ia_pro_questions', JSON.stringify(enemDatabase));
                    createBubble(`✅ ${enemDatabase.reduce((acc, fase) => acc + fase.questions.length, 0)} questões importadas!`, 'bot');
                    if (document.getElementById('exam-panel').classList.contains('open')) showLanding();
                } else { alert("Estrutura inválida."); }
            } catch (error) { alert("Erro ao importar."); }
        };
        reader.readAsText(file); event.target.value = '';
    }

    function clearAllData() {
        if(confirm("Apagar TUDO?")) { localStorage.removeItem('ia_pro_state'); localStorage.removeItem('ia_pro_questions'); location.reload(); }
    }

    function saveState() { localStorage.setItem('ia_pro_state', JSON.stringify(state)); }

    window.onload = () => {
        loadChatHistory();
        if(state.examState.currentExam) { toggleExamPanel(true); showQuestion(); }
    };
</script>
</body>
</html>
