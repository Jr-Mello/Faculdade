<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Imagem</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h2>Analisador de Imagem</h2>
      <div class="upload-area">
        <label for="file-input" class="upload-label">
          Clique aqui ou arraste uma imagem
        </label>
    <input type="file" id="file-input" accept="image/*" hidden>
  </div>
  
  <div id="image-preview-container" style="display: none;">
    <img id="image-preview" src="" alt="Pré-visualização">
  </div>
  
  <div id="results" class="results-container" style="display: none;">
    <h3>Detalhes do Arquivo</h3>
    <ul>
      <li><strong>Nome:</strong> <span id="file-name">-</span></li>
      <li><strong>Tamanho:</strong> <span id="file-size">-</span></li>
      <li><strong>Tipo:</strong> <span id="file-type">-</span></li>
      <li><strong>Dimensões:</strong> <span id="file-dimensions">-</span></li>
    </ul>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
