<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento Crítico P2P - Engenharia Unopar</title>
    <style>
        body { background: #0a0e14; color: #00ff9d; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .grid { display: grid; grid-template-columns: repeat(4, 60px); gap: 15px; margin-bottom: 30px; }
        
        /* Estilo dos 16 Servidores (Edge Nodes) */
        .node { width: 60px; height: 60px; border: 2px solid #00ff9d; border-radius: 8px; display: flex; align-items: center; 
                justify-content: center; font-size: 10px; position: relative; transition: all 0.3s; }
        .node.active { background: rgba(0, 255, 157, 0.2); box-shadow: 0 0 10px #00ff9d; }
        .node.alert { border-color: #f39c12; color: #f39c12; background: rgba(243, 156, 18, 0.2); animation: shake 0.2s infinite; }
        
        /* O 17º Servidor (Watchdog/Decodificador) */
        .watchdog { width: 150px; height: 40px; border: 2px solid #3498db; color: #3498db; display: flex; 
                    align-items: center; justify-content: center; border-radius: 20px; margin-bottom: 20px; font-weight: bold; }

        /* Console de Logs JSON */
        .console { width: 500px; height: 150px; background: rgba(0,0,0,0.9); border: 1px solid #333; padding: 15px; 
                   font-size: 11px; color: #aaa; overflow-y: hidden; }
        .log-json { color: #3498db; margin-bottom: 5px; border-left: 2px solid #3498db; padding-left: 10px; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    </style>
</head>
<body>

    <h2 style="color: #fff;">Simulação P2P Blockchain: Edge AI & Gossip</h2>

    <!-- O 17º Servidor de Backup -->
    <div class="watchdog" id="node-17">NODE_17: WATCHDOG</div>

    <!-- Grade de 16 Servidores -->
    <div class="grid" id="node-grid"></div>

    <!-- Console de Metadados JSON -->
    <div class="console" id="log-console">
        <div class="log-json">> Inicializando Cluster 16+1...</div>
        <div class="log-json">> Protocolo Gossip Ativo (UDP/JSON).</div>
    </div>

    <script>
        const grid = document.getElementById('node-grid');
        const consoleLog = document.getElementById('log-console');
        const watchdog = document.getElementById('node-17');

        // Criar os 16 nós
        for (let i = 1; i <= 16; i++) {
            const div = document.createElement('div');
            div.className = 'node active';
            div.id = `node-${i}`;
            div.innerText = `ID: ${i}`;
            grid.appendChild(div);
        }

        function addLog(msg, isAlert = false) {
            const entry = document.createElement('div');
            entry.className = 'log-json';
            if (isAlert) entry.style.color = '#f39c12';
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleLog.prepend(entry);
            if (consoleLog.children.length > 6) consoleLog.removeChild(consoleLog.lastChild);
        }

        // Simulação de Evento Crítico (Queda/Violência)
        function simulateEvent() {
            const randomNodeId = Math.floor(Math.random() * 16) + 1;
            const node = document.getElementById(`node-${randomNodeId}`);
            
            // 1. Detecção Local (Edge AI)
            node.classList.add('alert');
            addLog(`{ "node": ${randomNodeId}, "event": "FALL_DETECTED", "conf": 0.98 }`, true);
            
            // 2. Resposta Determinística (Alerta Local)
            console.log("Alerta Sonoro Local Ativado!");

            // 3. Propagação Gossip (Fofoca) & Validação PoA
            setTimeout(() => {
                addLog(`> Gossip: Nó ${randomNodeId} propagando metadados...`);
                watchdog.style.background = 'rgba(52, 152, 219, 0.2)';
                addLog(`> PoA: Bloco assinado pela Autoridade Central.`);
            }, 1000);

            // Reset
            setTimeout(() => {
                node.classList.remove('alert');
                watchdog.style.background = 'none';
            }, 4000);
        }

        setInterval(simulateEvent, 7000);
    </script>
</body>
</html>
