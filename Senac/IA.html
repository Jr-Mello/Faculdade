<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA Offline com Memória</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; gap: 10px; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 16px; position: relative; }
        .user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); white-space: pre-wrap; }
        
        #input-area { background: white; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        button { padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: white; }
        .btn-clear { background: #e74c3c; color: white; font-size: 12px; }
        .status { font-size: 12px; color: #7f8c8d; text-align: center; padding: 5px; background: #eee; }
    </style>
</head>
<body>

<header>
    <strong>Tutor IA Local</strong>
    <div class="controls">
        <select id="persona-select">
            <option value="math">Matemática</option>
            <option value="history">História</option>
            <option value="grammar">Português</option>
        </select>
        <button class="btn-clear" onclick="clearChat()">Limpar Chat</button>
    </div>
</header>

<div id="chat-container"></div>
<div class="status" id="status-text">Pronto</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Sua dúvida..." onkeypress="if(event.key === 'Enter') askAI()">
    <button class="btn-send" id="send-btn" onclick="askAI()">Enviar</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const inputField = document.getElementById('user-input');
    const personaSelect = document.getElementById('persona-select');
    
    const PERSONAS = {
        math: "Você é um tutor de Matemática. Ajude o aluno a resolver problemas passo a passo.",
        history: "Você é um historiador. Explique o contexto e as causas dos eventos.",
        grammar: "Você é um mentor de redação. Foque em clareza e correção gramatical."
    };

    // 1. Carregar chat ao iniciar
    window.onload = loadChat;

    async function askAI() {
        const userText = inputField.value.trim();
        if (!userText) return;

        addMessage(userText, 'user');
        inputField.value = '';
        
        const aiMsgDiv = addMessage('...', 'ai');
        toggleInput(true);

        try {
            const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                body: JSON.stringify({
                    model: 'llama3',
                    prompt: userText,
                    system: PERSONAS[personaSelect.value],
                    stream: true
                })
            });

            const reader = response.body.getReader();
            aiMsgDiv.innerText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = new TextDecoder().decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (!line) continue;
                    const json = JSON.parse(line);
                    if (json.response) {
                        aiMsgDiv.innerText += json.response;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }
            }
            saveChat(); // 2. Salvar após a resposta completa
        } catch (err) {
            aiMsgDiv.innerText = "Erro ao conectar com Ollama.";
        } finally {
            toggleInput(false);
        }
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerText = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    function toggleInput(disabled) {
        inputField.disabled = disabled;
        document.getElementById('send-btn').disabled = disabled;
        document.getElementById('status-text').innerText = disabled ? "IA respondendo..." : "Pronto";
    }

    // 3. Funções de Persistência
    function saveChat() {
        const messages = [];
        document.querySelectorAll('.message').forEach(msg => {
            messages.push({
                type: msg.classList.contains('user') ? 'user' : 'ai',
                text: msg.innerText
            });
        });
        localStorage.setItem('tutor_chat_history', JSON.stringify(messages));
    }

    function loadChat() {
        const history = JSON.parse(localStorage.getItem('tutor_chat_history'));
        if (history) {
            history.forEach(msg => addMessage(msg.text, msg.type));
        } else {
            addMessage("Olá! Sou seu tutor. Como posso ajudar?", "ai");
        }
    }

    function clearChat() {
        if(confirm("Deseja apagar todo o histórico?")) {
            localStorage.removeItem('tutor_chat_history');
            chatContainer.innerHTML = '';
            addMessage("Histórico limpo. Como posso ajudar agora?", "ai");
        }
    }
</script>
</body>
</html>
