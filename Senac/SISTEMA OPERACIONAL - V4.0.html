<html lang="pt-br"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>SISTEMA OPERACIONAL - V4.0</title>
    <style>
        @import url('https://fonts.googleapis.com');

        :root {
            --neon-blue: #00d2ff;
            --neon-green: #39ff14;
            --core-violet: #9d50bb;
            --dark-bg: #050a0f;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, #102030 0%, #050a0f 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
        }

        /* Moldura do HUD */
        .hud-frame {
            position: relative;
            padding: 80px;
            border: 2px solid rgba(0, 210, 255, 0.1);
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 60px;
            box-shadow: inset 0 0 50px rgba(0, 210, 255, 0.05);
        }

        .hud-frame::before {
            content: "SYSTEM_STATUS: ONLINE";
            position: absolute;
            top: 20px; left: 40px;
            font-family: 'Orbitron'; font-size: 12px; color: var(--neon-blue);
            letter-spacing: 3px; animation: blink 1s infinite;
        }

        /* Nodes Estilizados */
        .node {
            position: relative;
            width: 220px; height: 130px;
            background: rgba(0, 20, 30, 0.8);
            border-left: 5px solid var(--neon-blue);
            clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 10% 100%, 0 80%);
            display: flex; flex-direction: column; justify-content: center; padding-left: 25px;
            transition: 0.5s ease; cursor: pointer;
        }

        .node:hover {
            background: rgba(0, 210, 255, 0.15);
            box-shadow: -10px 0 30px rgba(0, 210, 255, 0.4);
            transform: scale(1.05);
        }

        .node h3 {
            font-family: 'Orbitron'; margin: 0; font-size: 1.1rem; color: var(--neon-blue);
        }

        .node .ip { font-size: 0.7rem; color: var(--neon-green); margin-bottom: 10px; }

        /* Linhas de Conexão com Gradiente Animado */
        .wire {
            width: 100px; height: 2px;
            background: linear-gradient(90deg, var(--neon-blue), transparent);
            position: relative;
        }

        .data-bit {
            width: 30px; height: 2px;
            background: white;
            position: absolute;
            box-shadow: 0 0 10px white;
            animation: dataFlow 1.5s infinite linear;
        }

        /* Central Node (Seu App) */
        .core-node {
            border-left-color: var(--core-violet) !important;
            background: rgba(40, 10, 50, 0.6) !important;
        }
        
        .core-node h3 { color: #d6a4ff; }

        @keyframes dataFlow {
            0% { left: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Gráfico de Pulso no Fundo */
        .wave-box {
            position: absolute; bottom: 30px; right: 80px; width: 150px; opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="hud-frame">
        <!-- NODE 1 -->
        <div class="node">
            <div class="ip">192.168.88.1</div>
            <h3>MIKROTIK</h3>
            <span style="font-size: 0.6rem;">GATEWAY HW</span>
        </div>

        <div class="wire"><div class="data-bit"></div></div>

        <!-- NODE 2 (CORE) -->
        <div class="node core-node">
            <div class="ip">SERVER_PORT: 8080</div>
            <h3>ANDROID OS</h3>
            <span style="font-size: 0.6rem; color: #a29bfe;">JAVA RUNTIME</span>
        </div>

        <div class="wire"><div class="data-bit" style="animation-delay: 0.7s;"></div></div>

        <!-- NODE 3 -->
        <div class="node">
            <div class="ip">USER_CLIENT</div>
            <h3>BROWSER</h3>
            <span style="font-size: 0.6rem;">FRONT-END V.2</span>
        </div>

        <!-- Elementos Decorativos -->
        <div class="wave-box">
            <svg viewBox="0 0 100 20"><path d="M0 10 Q 12.5 0 25 10 T 50 10 T 75 10 T 100 10" fill="none" stroke="#00d2ff" stroke-width="1" stroke-dasharray="2 1"></path></svg>
            <div style="font-size: 8px; text-align: center;">LATENCY: 2ms</div>
        </div>
    </div>



</body></html>
