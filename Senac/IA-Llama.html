<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama Mobile Server UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        .chat-container { height: calc(100vh - 160px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        pre { background: #1f2937; padding: 10px; border-radius: 5px; overflow-x: auto; color: #f8f8f2; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <div class="max-w-4xl mx-auto p-4">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-blue-400">Llama Node <span class="text-xs bg-blue-900 text-blue-200 px-2 py-1 rounded">Mobile Server</span></h1>
            <input id="serverIp" type="text" placeholder="IP do Celular (ex: 192.168.1.15)" 
                   class="bg-gray-800 border border-gray-600 px-3 py-1 rounded text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </header>

        <!-- Chat Box -->
        <div id="chatBox" class="chat-container overflow-y-auto space-y-4 mb-4 p-4 bg-gray-800 rounded-lg shadow-inner">
            <div class="text-center text-gray-500 mt-10">Conecte ao IP do smartphone e envie uma mensagem...</div>
        </div>

        <!-- Input Area -->
        <div class="relative">
            <textarea id="userInput" rows="2" placeholder="Digite sua pergunta..." 
                      class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 pr-16 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            <button onclick="sendPrompt()" id="sendBtn"
                    class="absolute right-3 bottom-3 bg-blue-600 hover:bg-blue-500 p-2 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const serverIp = document.getElementById('serverIp');

        // Carregar IP salvo no navegador
        serverIp.value = localStorage.getItem('lastIp') || '';

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `p-4 rounded-lg ${role === 'user' ? 'bg-gray-700 ml-12' : 'bg-gray-900 mr-12 border border-gray-700'}`;
            div.innerHTML = `<b class="block mb-2 text-xs uppercase tracking-widest ${role === 'user' ? 'text-blue-300' : 'text-green-400'}">${role}</b>
                             <div class="prose prose-invert max-w-none">${marked.parse(text)}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.querySelector('div');
        }

        async function sendPrompt() {
            const text = userInput.value.trim();
            const ip = serverIp.value.trim();
            if (!text || !ip) return alert("Preencha o IP e a mensagem!");

            localStorage.setItem('lastIp', ip);
            userInput.value = '';
            appendMessage('user', text);
            
            const responseDiv = appendMessage('llama', '...');
            let fullText = '';

            try {
                const response = await fetch(`http://${ip}:11434/api/generate`, {
                    method: 'POST',
                    body: JSON.stringify({ model: 'llama3.2:1b', prompt: text }),
                    headers: { 'Content-Type': 'application/json' }
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                responseDiv.innerHTML = ''; // Limpa o "..."

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        const json = JSON.parse(line);
                        if (json.response) {
                            fullText += json.response;
                            responseDiv.innerHTML = marked.parse(fullText); // Renderiza Markdown em tempo real
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                responseDiv.innerHTML = `<span class="text-red-500">Erro: Certifique-se que o Ollama está rodando com OLLAMA_ORIGINS="*" no seu celular.</span>`;
            }
        }
    </script>
</body>
</html>
