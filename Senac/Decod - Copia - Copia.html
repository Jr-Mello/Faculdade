<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Ecosystem - Hybrid Dashboard</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #0a0a0a;
            --card: #161616;
            --error: #ff3333;
            --backup: #00d4ff;
            --text-dim: #666;
            --border: #333;
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background: #000; border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 30px; }

        .tab-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: transparent; border: 1px solid #444; color: #888; text-align: left; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .tab-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 255, 65, 0.05); }

        .main-layout { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .content { display: none; padding: 30px; }
        .content.active { display: block; }

        .master-box { border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; background: var(--card); }
        .node-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-top: 20px; }
        .node-unit { height: 30px; background: var(--primary); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: black; font-weight: bold; transition: 0.3s; }
        .node-off { background: var(--error) !important; animation: blink 0.8s infinite; }

        .sim-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .mini-server { background: #111; border: 1px solid var(--border); height: 110px; position: relative; overflow: hidden; border-radius: 6px; }
        .mini-label { position: absolute; top: 5px; left: 8px; font-size: 10px; color: #555; font-family: monospace; }
        
        .ai-pulse { position: absolute; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; opacity: 0; filter: blur(2px); top: 45%; left: 45%; }
        .data-flow { animation: flow 0.6s ease-out; }
        @keyframes flow { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }

        .canvas { background: #000; width: 100%; height: 350px; border: 2px solid var(--border); position: relative; border-radius: 8px; overflow: hidden; }
        .box { position: absolute; border: 2px solid var(--primary); background: rgba(0,255,65,0.1); color: var(--primary); font-weight: bold; padding: 4px; font-size: 11px; pointer-events: none; }
        
        textarea { width: 100%; height: 120px; background: #000; color: var(--primary); border: 1px solid var(--border); font-family: monospace; padding: 12px; margin-top: 15px; }
        #liveLogs { font-size: 11px; font-family: monospace; height: 300px; overflow-y: hidden; color: #888; }
        
        .action-btn { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>P2P HYBRID OS</h2>
        <button class="tab-btn active" onclick="openTab(event, 'monitor')">Orquestrador (Nó 17)</button>
        <button class="tab-btn" onclick="openTab(event, 'simulacao')">Simulação em Tempo Real</button>
        <button class="tab-btn" onclick="openTab(event, 'ai')">Interpretador IA (JSON)</button>
        <div style="margin-top: auto; font-size: 12px; color: var(--text-dim);">
            SISTEMA: <span id="sysStatus" style="color: var(--primary)">ONLINE</span><br>
            Uptime: <span id="uptime">00:00:00</span>
        </div>
    </aside>

    <main class="main-layout">
        <section id="monitor" class="content active">
            <h1>Orquestrador de Rede</h1>
            <div class="master-box" id="masterServer">
                <h3 id="masterTitle">STATUS: OPERACIONAL</h3>
                <button class="action-btn" onclick="triggerFailover()" style="background: var(--error); color: white;">Simular Falha Crítica</button>
                <div class="node-grid" id="p2pGrid"></div>
            </div>
            <div class="master-box" id="backupServer" style="border-color: var(--backup); display: none; color: var(--backup);">
                <h3>REDUNDÂNCIA ATIVA: SERVIDOR CLONE ASSUMIU</h3>
            </div>
        </section>

        <section id="simulacao" class="content">
            <h1>Simulação em Tempo Real</h1>
            <div style="display: grid; grid-template-columns: 1fr 320px; gap: 20px;">
                <div id="serverGridSim" class="sim-grid"></div>
                <div class="master-box">
                    <h4 style="color:var(--primary); margin:0 0 10px 0;">Live Logs</h4>
                    <div id="liveLogs">> Escaneando...</div>
                </div>
            </div>
        </section>

        <section id="ai" class="content">
            <h1>Interpretador JSON</h1>
            <div class="canvas" id="iaCanvas"></div>
            <textarea id="jsonInput">{ "payload": { "object": "PESSOA", "confidence": 0.95, "box": [50, 50, 120, 180] } }</textarea>
            <button class="action-btn" onclick="processAI()" style="background:var(--primary); margin-top:10px;">INJETAR DADOS</button>
        </section>
    </main>

    <script>
        // Montagem das grades
        const p2pGrid = document.getElementById('p2pGrid');
        const simGrid = document.getElementById('serverGridSim');

        for(let i=1; i<=16; i++) {
            p2pGrid.innerHTML += `<div class="node-unit" id="n-${i}">${i}</div>`;
            simGrid.innerHTML += `
                <div class="mini-server">
                    <div class="mini-label">SVR-${i}</div>
                    <div id="pulse-${i}" class="ai-pulse"></div>
                    <div id="txt-${i}" style="font-size:9px; position:absolute; bottom:5px; left:5px; color:#444;">IDLE</div>
                </div>`;
        }

        function openTab(evt, tabName) {
            document.querySelectorAll(".content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function triggerFailover() {
            document.getElementById('masterServer').style.borderColor = '#ff3333';
            document.getElementById('masterTitle').style.color = '#ff3333';
            document.getElementById('masterTitle').innerText = "FALHA CRÍTICA NO NÓ 17";
            document.getElementById('sysStatus').innerText = "FAILOVER...";
            document.getElementById('sysStatus').style.color = '#ff3333';
            
            [4, 12].forEach(id => document.getElementById(`n-${id}`).classList.add('node-off'));

            setTimeout(() => {
                document.getElementById('backupServer').style.display = 'block';
                document.getElementById('sysStatus').innerText = "MODO BACKUP";
                document.getElementById('sysStatus').style.color = '#00d4ff';
            }, 1000);
        }

        function processAI() {
            try {
                const data = JSON.parse(document.getElementById('jsonInput').value);
                document.querySelectorAll('.box').forEach(b => b.remove());
                const [x, y, w, h] = data.payload.box;
                const b = document.createElement('div');
                b.className = 'box';
                b.style.cssText = `left:${x}px; top:${y}px; width:${w}px; height:${h}px;`;
                b.innerHTML = `${data.payload.object} ${(data.payload.confidence*100).toFixed(0)}%`;
                document.getElementById('iaCanvas').appendChild(b);
            } catch(e) { alert("Erro JSON: " + e.message); }
        }

        setInterval(() => {
            if(!document.getElementById('simulacao').classList.contains('active')) return;
            const target = Math.floor(Math.random() * 16) + 1;
            const pulse = document.getElementById(`pulse-${target}`);
            pulse.classList.add('data-flow');
            setTimeout(() => pulse.classList.remove('data-flow'), 600);
            
            const logs = document.getElementById('liveLogs');
            logs.innerHTML = `<div>[${new Date().toLocaleTimeString()}] SVR-${target} DETECT: MOVIMENTO</div>` + logs.innerHTML;
        }, 2000);

        let s = 0;
        setInterval(() => {
            s++;
            let time = new Date(s * 1000).toISOString().substr(11, 8);
            document.getElementById('uptime').innerText = time;
        }, 1000);
    </script>
</body>
</html>
