<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard AI P2P - Ecossistema de Automação</title>
    <style>
        :root {
            --primary: #00ff41; /* Verde Matrix/Terminal */
            --bg: #0d0d0d;
            --card: #1a1a1a;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', monospace;
            margin: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .monitor-canvas {
            background: #000;
            border: 2px solid var(--primary);
            position: relative;
            width: 640px;
            height: 360px;
            overflow: hidden;
        }
        .bounding-box {
            position: absolute;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .json-feed {
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
            height: 500px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #333;
        }
        .status-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .badge {
            background: #333;
            padding: 5px 10px;
            border-radius: 4px;
            border-left: 3px solid var(--primary);
        }
        pre { color: var(--primary); }
        .camera-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--primary);
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <h1>AI Edge Computing - P2P Network Monitor</h1>
    
    <div class="status-bar">
        <div class="badge">Nodes Ativos: 16</div>
        <div class="badge">Protocolo: WebSockets/JSON</div>
        <div class="badge">Engine: TensorFlow Lite Offline</div>
    </div>

    <div class="grid">
        <!-- Visualização da IA -->
        <div>
            <h3>Live Stream: Server_Alpha_04 (Processamento Local)</h3>
            <div class="monitor-canvas" id="canvas">
                <div class="camera-overlay">REC ● 1080p - 30fps</div>
                <!-- A Bounding Box vai aparecer aqui via JS -->
            </div>
        </div>

        <!-- Feed JSON em tempo real -->
        <div>
            <h3>WebSocket Data Stream (JSON)</h3>
            <div class="json-feed" id="jsonFeed">
                <p>> Aguardando pacotes P2P...</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const jsonFeed = document.getElementById('jsonFeed');

        // Simulação de objetos que a IA poderia detectar
        const mockObjects = ['Pessoa', 'Smartphone', 'Cachorro', 'Lâmpada'];

        function simulateIncomingP2PData() {
            // Gera coordenadas aleatórias para simular a IA detectando algo
            const x = Math.random() * 400;
            const y = Math.random() * 200;
            const obj = mockObjects[Math.floor(Math.random() * mockObjects.length)];
            const conf = (Math.random() * (0.99 - 0.85) + 0.85).toFixed(2);

            // 1. Criar o JSON conforme nossa estrutura
            const p2pMessage = {
                "header": {
                    "node_id": "server_alpha_04",
                    "timestamp": new Date().toISOString(),
                    "protocol_version": "1.2.0"
                },
                "payload": {
                    "type": "vision_analysis",
                    "detections": [{
                        "object": obj,
                        "confidence": conf,
                        "box": [Math.round(x), Math.round(y), 150, 150]
                    }]
                }
            };

            // 2. Atualizar o Feed JSON na tela
            const log = document.createElement('pre');
            log.innerHTML = `> Recebido de Node_04:\n${JSON.stringify(p2pMessage, null, 2)}`;
            jsonFeed.prepend(log);

            // 3. Atualizar a "Bounding Box" visual no Canvas
            updateVisualBox(x, y, obj, conf);
        }

        function updateVisualBox(x, y, label, conf) {
            // Remove box anterior
            const oldBox = document.querySelector('.bounding-box');
            if (oldBox) oldBox.remove();

            // Cria nova box
            const box = document.createElement('div');
            box.className = 'bounding-box';
            box.style.left = x + 'px';
            box.style.top = y + 'px';
            box.style.width = '150px';
            box.style.height = '150px';
            box.innerHTML = `&nbsp;${label} ${Math.round(conf*100)}%`;
            
            canvas.appendChild(box);
        }

        // Simula o recebimento de dados a cada 3 segundos
        setInterval(simulateIncomingP2PData, 3000);
    </script>
</body>
</html>
