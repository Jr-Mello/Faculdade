<html lang="pt-br"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Simulador de Torque Pneumático 1:9</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        canvas { background: radial-gradient(circle, #1e293b 0%, #020617 100%); border: 2px solid #334155; border-radius: 15px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .dashboard { margin-top: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 940px; }
        .card { background: #1e293b; padding: 12px; border-radius: 10px; border-bottom: 3px solid #3b82f6; text-align: center; }
        label { display: block; font-size: 0.7em; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        value { font-size: 1.1em; font-weight: bold; color: #38bdf8; font-family: monospace; }
        .unit { font-size: 0.8em; color: #64748b; margin-left: 4px; }
        .highlight { color: #f87171 !important; }
    </style>
</head>
<body>

    <h2 style="font-weight: 300; letter-spacing: 3px;">ANÁLISE DINÂMICA DE FORÇA <span style="color:#3b82f6">1:9</span></h2>
    
    <canvas id="canvas" width="940" height="480"></canvas>

    <div class="dashboard">
        <div class="card"><label>Força do Cilindro (F1)</label><value id="f-linear">132</value><span class="unit">N</span></div>
        <div class="card"><label>Torque no Eixo (T1)</label><value id="t-eixo">23.8</value><span class="unit">Nm</span></div>
        <div class="card"><label>Torque de Saída (T2)</label><value id="t-saida">2.65</value><span class="unit">Nm</span></div>
        <div class="card"><label>Ganho de Velocidade</label><value id="v-ratio">9x</value><span class="unit">RPM</span></div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- PARÂMETROS FÍSICOS REAIS ---
const PRESSAO_BAR = 6.0;         // 6 bar
const DIAMETRO_CIL = 50;        // 50mm
const RAIO_ALAVANCA = 0.18;     // 18cm (0.18m)
const RATIO = 9;                // Relação 1:9

// Cálculos Iniciais
const area = Math.PI * Math.pow((DIAMETRO_CIL/2)/1000, 2); // m²
const forcaMax = (PRESSAO_BAR * 100000) * area; // Newtons

const EIXO_X = 380, EIXO_Y = 240;
const SAIDA_X = 120, SAIDA_Y = 240;
const PIVO_CIL_X = 750, PIVO_CIL_Y = 400;

let time = 0;
let gearAngle = 0;
let armAngle = 0;
let lastArmPos = 0;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    time += 0.025;

    // 1. DINÂMICA
    let pushFactor = Math.cos(time);
    let isPushing = pushFactor > 0;
    let cycle = (Math.sin(time) + 1) / 2;
    armAngle = (cycle * 0.8) - 0.4; 

    // Cálculo de Força em tempo real
    let forcaAtual = isPushing ? forcaMax * pushFactor : 0;
    let torqueEixo = forcaAtual * RAIO_ALAVANCA;
    let torqueSaida = torqueEixo / RATIO;

    // Atualiza Painel
    document.getElementById('f-linear').innerText = Math.round(forcaAtual);
    document.getElementById('t-eixo').innerText = torqueEixo.toFixed(1);
    document.getElementById('t-saida').innerText = torqueSaida.toFixed(2);

    if (isPushing) {
        let diff = armAngle - lastArmPos;
        if (diff > 0) gearAngle += diff;
    }
    lastArmPos = armAngle;

    // --- DESENHO ---

    // A. Linhas de Força (Vetores)
    if (isPushing) {
        ctx.strokeStyle = "rgba(248, 113, 113, 0.5)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(EIXO_X - 100, EIXO_Y - 100, 200, 200);
        ctx.setLineDash([]);
    }

    // B. Conexão entre eixos
    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(EIXO_X, EIXO_Y); ctx.lineTo(SAIDA_X, SAIDA_Y); ctx.stroke();

    // C. Pinhão de Saída (Alta Velocidade)
    drawGear(SAIDA_X, SAIDA_Y, 25, gearAngle * RATIO, 10, "#38bdf8", "SAÍDA (T2)");

    // D. Catraca e Eixo de Força
    drawRatchet(EIXO_X, EIXO_Y, 70, gearAngle);

    // E. Alavanca
    let lx = EIXO_X + 180 * Math.cos(armAngle + Math.PI/2);
    let ly = EIXO_Y + 180 * Math.sin(armAngle + Math.PI/2);
    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(EIXO_X, EIXO_Y); ctx.lineTo(lx, ly); ctx.stroke();

    // F. Cilindro e Haste
    drawCylinder(PIVO_CIL_X, PIVO_CIL_Y, lx, ly, isPushing);

    // G. Lingueta
    ctx.save();
    ctx.translate(EIXO_X, EIXO_Y - 82);
    ctx.fillStyle = isPushing ? "#4ade80" : "#f87171";
    ctx.fillRect(-6, 0, 12, 25);
    ctx.restore();

    requestAnimationFrame(draw);
}

function drawGear(x, y, r, ang, t, col, label) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = col; ctx.beginPath();
    for(let i=0; i<t*2; i++) {
        let a = (i/t)*Math.PI; let d = i%2==0?r:r+8;
        ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#94a3b8"; ctx.fillText(label, x-30, y+50);
}

function drawRatchet(x, y, r, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "#475569"; ctx.beginPath();
    for(let i=0; i<12; i++) {
        let a = (i/12)*Math.PI*2;
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        ctx.lineTo(Math.cos(a+0.15)*(r+15), Math.sin(a+0.15)*(r+15));
        ctx.lineTo(Math.cos(a+0.15)*r, Math.sin(a+0.15)*r);
    }
    ctx.fill(); ctx.restore();
    ctx.fillStyle = "#fff"; ctx.fillText("EIXO FORÇA (T1)", x-40, y-100);
}

function drawCylinder(px, py, lx, ly, pushing) {
    let ang = Math.atan2(ly - py, lx - px);
    let dist = Math.hypot(lx - px, ly - py);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(ang);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(0, -22, 160, 44);
    ctx.strokeStyle = pushing ? "#4ade80" : "#3b82f6"; ctx.strokeRect(0, -22, 160, 44);
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(dist, 0); ctx.stroke();
    ctx.restore();
}

draw();
</script>


</body></html>
