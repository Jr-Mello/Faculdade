<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Industrial Unit v13.0 - Final Edition</title>
    <style>
        :root { --bg: #010409; --p1: #58a6ff; --accent: #3fb950; --warn: #d29922; --crit: #f85149; --panel: #161b22; }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Segoe UI Mono', monospace; margin: 0; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; padding: 12px 25px; background: #0d1117; border-bottom: 2px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 100; position: relative; }
        .main-layout { display: flex; padding: 15px; gap: 15px; height: calc(100vh - 190px); }
        
        .side-panel { width: 320px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px; }
        .panel { background: var(--panel); border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
        
        label { display: block; font-size: 9px; color: #8b949e; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; border-left: 3px solid var(--p1); padding-left: 8px; }
        
        .gauge-bg { background: #0d1117; height: 8px; border-radius: 4px; margin: 8px 0; overflow: hidden; border: 1px solid #30363d; }
        .gauge-fill { height: 100%; transition: width 0.2s; }
        
        input[type="range"] { width: 100%; margin: 8px 0; accent-color: var(--p1); cursor: pointer; }
        
        .canvas-container { position: relative; flex-grow: 1; background: radial-gradient(circle, #161b22 0%, #010409 100%); border: 1px solid #30363d; border-radius: 12px; }
        #telemetryCanvas { position: absolute; bottom: 15px; left: 15px; border: 1px solid #30363d; background: rgba(0,0,0,0.8); }
        
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 15px 15px; }
        .card { background: var(--panel); border: 1px solid #30363d; padding: 10px; border-radius: 8px; text-align: center; }
        .value { font-size: 22px; font-weight: bold; color: #f0f6fc; display: block; }
        .unit { font-size: 8px; color: #8b949e; }
        
        .btn-prime { width: 100%; padding: 8px; background: #238636; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
        .btn-turbo { width: 100%; padding: 8px; background: var(--warn); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
        
        #terminal-log { font-size: 9px; color: var(--accent); height: 80px; overflow-y: auto; scroll-behavior: smooth; border-top: 1px solid #30363d; padding-top: 5px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold;"><span id="status-dot" style="color:var(--accent)">●</span> UNIT_V13.0 <span style="color:#444">|</span> STABLE</div>
    <div id="thermal-stat" style="font-size: 12px;">TEMP: 24°C</div>
    <div id="tank-text" style="color:var(--p1)">PSI_NET: 100%</div>
</div>

<div class="main-layout">
    <div class="side-panel">
        <div class="panel">
            <label>Pneumatic & Turbo</label>
            <div class="gauge-bg"><div id="tank-bar" class="gauge-fill" style="width: 100%; background: var(--accent);"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:10px">
                <span id="tank-press">10.0 BAR</span>
                <span id="air-flow" style="color:var(--p1)">0.0 L/M</span>
            </div>
            <button class="btn-prime" onclick="recharge()">RECHARGE TANK</button>
            <button id="btn-turbo" class="btn-turbo" onclick="toggleTurbo()">ENGAGE TURBO [BATT]</button>
        </div>

        <div class="panel">
            <label>Load & Friction</label>
            <div style="font-size:10px">BRAKE RESISTANCE: <b id="brake-val" style="color:var(--crit)">0</b> N.m</div>
            <input type="range" id="brake-range" min="0" max="50" value="0">
            <div style="font-size:10px">SYSTEM INERTIA: <b id="ine-val">85</b>%</div>
            <input type="range" id="inercia" min="50" max="99" value="85">
        </div>

        <div class="panel">
            <label>Generator & Battery</label>
            <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px">
                <span>VOLTS: <b id="gen-volt" style="color:var(--p1)">0.0</b></span>
                <span>AMPS: <b id="gen-curr" style="color:var(--accent)">0.00</b></span>
            </div>
            <div class="gauge-bg"><div id="battery-bar" class="gauge-fill" style="width:15%; background:var(--p1)"></div></div>
            <div style="font-size:9px; color:#8b949e">CHARGE: <span id="batt-perc">15</span>%</div>
        </div>

        <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column;">
            <label>System Terminal</label>
            <div id="terminal-log"></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
        <canvas id="telemetryCanvas" width="220" height="80"></canvas>
    </div>
</div>

<div class="dashboard">
    <div class="card"><span class="value" id="cons-total">0.00</span><span class="unit">M³ CONSUMED</span></div>
    <div class="card"><span class="value" id="t-avg">0.0</span><span class="unit">NET TORQUE</span></div>
    <div class="card"><span class="value" id="rpm-out">0</span><span class="unit">OUTPUT RPM</span></div>
    <div class="card"><span class="value" id="cost-val" style="color:var(--warn)">0.00</span><span class="unit">BRL COST</span></div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const tctx = document.getElementById('telemetryCanvas').getContext('2d');

let state = {
    tank: 200, consumed: 0, time: 0, v: 0, a: 0,
    history: new Array(220).fill(0),
    battery: 15, volts: 0, amps: 0,
    temp: 24, particles: [], turbo: false
};

const CFG = { max: 200, diam: 0.063, stroke: 0.12, gear: 9, cost: 0.75 };

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.onresize = resize; resize();

function addLog(msg, color = "var(--accent)") {
    const log = document.getElementById('terminal-log');
    const div = document.createElement('div');
    div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
    div.style.color = color;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    if(log.childElementCount > 15) log.removeChild(log.firstChild);
}

function recharge() { state.tank = 200; addLog("TANK_REPRESSURIZED", "var(--p1)"); }
function toggleTurbo() { 
    if(state.battery < 5) { addLog("TURBO_FAILED: LOW_BATT", "var(--crit)"); return; }
    state.turbo = !state.turbo; 
    addLog(state.turbo ? "TURBO_ENGAGED" : "TURBO_DISENGAGED", state.turbo ? "var(--warn)" : "var(--accent)");
}

function drawEngine(cx, cy) {
    const drawPiston = (off, col, px, py) => {
        let cycle = Math.sin(state.time + off);
        let active = Math.cos(state.time + off) > 0;
        let lx = cx + 170 * Math.cos(cycle * 0.45 + Math.PI/2);
        let ly = cy + 170 * Math.sin(cycle * 0.45 + Math.PI/2);

        ctx.strokeStyle = active ? col : "#333"; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(lx, ly); ctx.stroke();

        let ang = Math.atan2(ly-py, lx-px);
        ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
        ctx.fillStyle = "#0d1117"; ctx.strokeStyle = active ? col : "#444";
        ctx.beginPath(); ctx.roundRect(0, -22, 180, 44, 4); ctx.fill(); ctx.stroke();
        
        if(active && Math.random() > 0.8) {
            state.particles.push({x:lx, y:ly, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:1});
        }
        ctx.restore();
    };

    drawPiston(0, "#00f2ff", cx-280, cy+180);
    drawPiston(Math.PI, "#ff00f2", cx+280, cy+180);

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(state.a);
    ctx.fillStyle = "#1c2128"; ctx.strokeStyle = "#30363d";
    ctx.beginPath(); for(let i=0; i<32; i++){ let r = i%2==0 ? 80 : 70; ctx.lineTo(Math.cos(i/32*Math.PI*2)*r, Math.sin(i/32*Math.PI*2)*r); }
    ctx.fill(); ctx.stroke(); ctx.restore();

    state.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        ctx.fillStyle = `rgba(255,255,255,${p.life})`;
        ctx.fillRect(p.x, p.y, 2, 2);
        if(p.life <= 0) state.particles.splice(i, 1);
    });
}

let lastLog = 0;
function animate() {
    const brake = parseFloat(document.getElementById('brake-range').value);
    const ine = parseFloat(document.getElementById('inercia').value) / 100;
    
    // Turbo Logic
    let turboBoost = 0;
    if(state.turbo) {
        if(state.battery > 0.1) {
            state.battery -= 0.05;
            turboBoost = 4.0;
        } else {
            state.turbo = false;
            addLog("TURBO_DEPLETED", "var(--crit)");
        }
    }

    const tPress = (state.tank / 200) * 10;
    const ePress = Math.min(7, tPress) + turboBoost;
    const flow = (0.0031 * 0.12 * 1000) * 2 * 45 * (ePress + 1);
    
    if(state.tank > 0.1) {
        state.tank -= (flow/3600);
        state.consumed += (flow/3600);
        state.time += 0.06 * (state.turbo ? 1.5 : 1);
    }

    let tMotor = (Math.cos(state.time) > 0 || Math.cos(state.time + Math.PI) > 0) ? (ePress * 3.5) : 0;
    let tNet = tMotor - (state.v * 1.8) - (brake * 0.15);
    state.v = Math.max(0, (state.v + tNet * 0.001) * ine);
    state.a += state.v;
    state.temp = 24 + (state.v * 25) + (brake * 0.4);

    state.volts = Math.min(18, state.v * 75);
    state.amps = state.volts * 0.3 * (state.v > 0.1 ? 1 : 0);
    if(state.volts > 5.5 && !state.turbo) state.battery = Math.min(100, state.battery + state.amps*0.002);

    // Update UI
    document.getElementById('tank-bar').style.width = (state.tank/2) + "%";
    document.getElementById('tank-press').innerText = tPress.toFixed(1) + " BAR";
    document.getElementById('gen-volt').innerText = state.volts.toFixed(1);
    document.getElementById('battery-bar').style.width = state.battery + "%";
    document.getElementById('batt-perc').innerText = Math.floor(state.battery);
    document.getElementById('t-avg').innerText = (tNet * 9).toFixed(1);
    document.getElementById('rpm-out').innerText = Math.round(state.v * 700);
    document.getElementById('cons-total').innerText = (state.consumed/1000).toFixed(4);
    document.getElementById('cost-val').innerText = (state.consumed/1000 * 0.85 * 0.75).toFixed(2);
    document.getElementById('thermal-stat').innerText = `TEMP: ${state.temp.toFixed(1)}°C`;
    document.getElementById('brake-val').innerText = brake;
    document.getElementById('btn-turbo').style.opacity = state.turbo ? "0.5" : "1";
    document.getElementById('status-dot').style.color = state.temp > 60 ? "var(--crit)" : "var(--accent)";

    // Logs Periódicos
    if(Date.now() - lastLog > 5000) {
        if(state.temp > 55) addLog("WARNING: HIGH_THERMAL_LOAD", "var(--warn)");
        lastLog = Date.now();
    }

    ctx.clearRect(0,0,canvas.width, canvas.height);
    drawEngine(canvas.width/2, canvas.height/2 - 50);
    state.history.push(tNet); state.history.shift();
    tctx.clearRect(0,0,220,80); tctx.strokeStyle = "#58a6ff"; tctx.beginPath();
    state.history.forEach((v,i) => tctx.lineTo(i, 70 - v*1.5)); tctx.stroke();

    requestAnimationFrame(animate);
}
addLog("SYSTEM_READY");
animate();
</script>
</body>
</html>
